name: One-shot 270 recovery test family

on:
  push:
    branches:
      - repo/270-recovery-test-family

permissions:
  contents: write

jobs:
  relocate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move complete recovery test family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/recovery
          count=$(find tests -maxdepth 1 -type f -name 'recovery-*.test.mjs' | wc -l)
          test "$count" -eq 29
          git mv tests/recovery-*.test.mjs tests/recovery/
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path('tests/recovery').glob('recovery-*.test.mjs')):
              text = path.read_text()
              text = text.replace('from "../', 'from "../../')
              text = text.replace("from '../", "from '../../")
              text = text.replace('new URL("../', 'new URL("../../')
              text = text.replace("new URL('../", "new URL('../../")
              text = text.replace('new URL(`../', 'new URL(`../../')
              text = text.replace('new URL("..", import.meta.url)', 'new URL("../..", import.meta.url)')
              text = text.replace("new URL('..', import.meta.url)", "new URL('../..', import.meta.url)")

              if 'domain-path-contract' in path.name:
                  text = text.replace('["../', '["../../')
                  text = text.replace(', "../', ', "../../')
                  text = text.replace("['../", "['../../")
                  text = text.replace(", '../", ", '../../")

              path.write_text(text)
          PY

      - name: Build
        run: npm run build

      - name: Run complete recovery family
        run: node --test tests/recovery/*.test.mjs

      - name: Validate recursive discovery contracts
        run: node --test tests/node-test-discovery.test.mjs tests/test-layout-policy.test.mjs

      - name: Validate relocation invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tests/recovery -maxdepth 1 -type f -name 'recovery-*.test.mjs' | wc -l)" -eq 29
          test "$(find tests -maxdepth 1 -type f -name 'recovery-*.test.mjs' | wc -l)" -eq 0
          git diff --check

      - name: Commit validated relocation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-270-recovery-family.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: move recovery test family under domain owner"
          git push origin HEAD:repo/270-recovery-test-family
