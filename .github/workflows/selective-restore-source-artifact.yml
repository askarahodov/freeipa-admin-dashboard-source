name: Selective Restore Source Artifact

on:
  push:
    branches:
      - agent/selective-production-restore
    paths:
      - .github/workflows/selective-restore-source-artifact.yml
      - db/portal-schema.ts
      - db/portal-migrations.ts

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: selective-restore-schema-sources
          path: |
            db/portal-schema.ts
            db/portal-migrations.ts
          if-no-files-found: error
          retention-days: 1
