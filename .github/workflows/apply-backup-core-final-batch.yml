name: Apply backup core final batch

on:
  push:
    branches:
      - refactor/265-backup-core-final-batch
    paths:
      - .github/workflows/apply-backup-core-final-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: refactor/265-backup-core-final-batch
          fetch-depth: 0

      - name: Apply dependency-closed backup core move
        run: python3 .github/scripts/apply-backup-core-final-batch.py

      - name: Validate generated source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e backup-manifest.ts
          test ! -e backup-export-domains.ts
          test ! -e backup-full-domains.ts
          test -e src/backup/backup-manifest.ts
          test -e src/backup/export/backup-export-domains.ts
          test -e src/backup/export/backup-full-domains.ts
          node --experimental-strip-types --test \
            tests/backup-export-source-contract.test.mjs \
            tests/backup-encrypted-source-contract.test.mjs \
            tests/backup-root-ownership.test.mjs \
            tests/product-branding.test.mjs

      - name: Remove one-shot migration machinery
        run: |
          rm -f .github/scripts/apply-backup-core-final-batch.py
          rm -f .github/workflows/apply-backup-core-final-batch.yml

      - name: Commit final batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(backup): complete backup core ownership migration"
          git push origin HEAD:refactor/265-backup-core-final-batch
