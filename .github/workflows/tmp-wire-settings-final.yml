name: Temporary Settings Wiring Final
on:
  push:
    branches: [ui-118-wire-settings-final]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-118-wire-settings-final
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()
          audit_import = 'import { AuditLog } from "./audit/AuditLog";\n'
          assert audit_import in s
          if 'from "./settings/SettingsScreens"' not in s:
            s = s.replace(audit_import, audit_import + 'import { Settings } from "./settings/SettingsScreens";\n', 1)
          start = s.index('\nfunction PersistentConnectionSettings(')
          end = s.index('\nfunction FreeIpaActionModal(', start)
          s = s[:start] + '\n' + s[end:]
          s = re.sub(r'\nconst routeOperations = \[.*?\] as const;\n', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\nfunction routeSchemaDrift\(.*?\n}\n', '\n', s, count=1, flags=re.S)
          for name in ['CatalogHistoryEntry','SettingsData','CatalogPolicyRule','CatalogPolicySet','LocalizedProcessPresentation','ProcessPresentationSet']:
            s = re.sub(rf'^type {name} = .*?;\n', '', s, count=1, flags=re.M)
          s = s.replace('import { buildAutomationSlug, resolveProcessIconGlyph } from "./shell/home-presentation";', 'import { buildAutomationSlug } from "./shell/home-presentation";')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx
          git commit -m "ui: wire extracted Settings screens"
          git push
