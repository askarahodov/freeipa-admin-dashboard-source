name: PR Collision Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ownership-collision-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ownership-collision:
    name: ownership-collision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Check active PR ownership collisions
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr-collision-guard.mjs`).href;
            const { analyzePullRequestCollisions, formatCollisionReport } = await import(moduleUrl);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentPrNumber = Number(context.payload.pull_request?.number);
            if (!Number.isInteger(currentPrNumber)) {
              core.setFailed("Unable to resolve the current pull request number.");
              return;
            }

            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              per_page: 100,
            });

            const pullRequests = [];
            for (const pullRequest of openPullRequests) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              pullRequests.push({
                number: pullRequest.number,
                title: pullRequest.title,
                base: pullRequest.base.ref,
                state: pullRequest.state,
                files: files.map((file) => file.filename),
              });
            }

            const current = pullRequests.find((pullRequest) => pullRequest.number === currentPrNumber);
            if (!current) {
              core.setFailed(`Current PR #${currentPrNumber} was not returned by the open-main PR query.`);
              return;
            }

            const result = analyzePullRequestCollisions({
              currentPrNumber,
              currentFiles: current.files,
              pullRequests,
            });
            core.info(formatCollisionReport(result).trimEnd());
            if (result.blocking) {
              core.setFailed("Blocking ownership collision detected with another open PR targeting main.");
            }
