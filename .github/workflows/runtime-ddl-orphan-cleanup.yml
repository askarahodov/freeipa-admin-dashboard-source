name: Runtime DDL Orphan Cleanup

on:
  push:
    branches:
      - agent/remove-runtime-schema-ddl

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-runtime-schema-ddl
      - name: Remove orphan schema helpers
        run: |
          cat > /tmp/cleanup.mjs <<'JS'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          const ignored = new Set([".git", ".next", ".wrangler", "dist", "node_modules", "tests", "db"]);
          async function files(dir = process.cwd()) {
            const out = [];
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              if (entry.isDirectory() && ignored.has(entry.name)) continue;
              const absolute = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...await files(absolute));
              else if (entry.isFile() && entry.name.endsWith(".ts")) out.push(absolute);
            }
            return out;
          }
          function closeBrace(source, open) {
            let depth = 0, quote = "", escaped = false;
            for (let i = open; i < source.length; i += 1) {
              const c = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (c === "\\") escaped = true;
                else if (c === quote) quote = "";
                continue;
              }
              if (c === "'" || c === '"' || c === "`") { quote = c; continue; }
              if (c === "{") depth += 1;
              else if (c === "}" && --depth === 0) return i;
            }
            return -1;
          }
          for (const file of await files()) {
            let source = await readFile(file, "utf8");
            const original = source;
            const removed = [];
            const pattern = /(?:export\s+)?async\s+function\s+(ensure[A-Za-z0-9_]*)\s*\([^)]*\)[^{]*\{/g;
            let match;
            while ((match = pattern.exec(source))) {
              const open = source.indexOf("{", match.index);
              const close = closeBrace(source, open);
              if (close < 0) break;
              const body = source.slice(open + 1, close);
              if (!/prepare\(create[A-Za-z0-9_]+\)/.test(body)) continue;
              removed.push(match[1]);
              let end = close + 1;
              while (source[end] === "\r" || source[end] === "\n") end += 1;
              source = source.slice(0, match.index) + source.slice(end);
              pattern.lastIndex = match.index;
            }
            for (const name of removed) {
              source = source.replace(new RegExp(`^[\\t ]*await\\s+${name}\\([^;]*\\);[\\t ]*\\r?\\n`, "gm"), "");
            }
            if (source !== original) {
              await writeFile(file, source);
              console.log(path.relative(process.cwd(), file));
            }
          }
          JS
          node /tmp/cleanup.mjs
      - name: Verify build and focused tests
        run: |
          npm run install:ci
          npm run build
          node --experimental-strip-types --test tests/runtime-schema-ddl-contract.test.mjs tests/catalog-visibility-policies.test.mjs tests/catalog-scheduled-sync.test.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts'
          git commit -m "refactor: remove orphan runtime schema helpers"
          git push origin HEAD:agent/remove-runtime-schema-ddl
