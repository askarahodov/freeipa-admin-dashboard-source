name: Rebuild PR 448 correction

on:
  push:
    branches:
      - docs/268-ai-policy-owner

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild correction from merged main and pre-move approval owner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main --depth=50
          git show origin/main:docs/ai/README.md > docs/ai/README.md
          git show 080cf79c130e2dcf6232537ef6b6f8c4ff176e19:docs/APPROVAL_GATES.md > docs/APPROVAL_GATES.md
          rm -f docs/ai/APPROVAL_GATES.md

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ai/README.md')
          lines = [line for line in p.read_text().splitlines() if 'APPROVAL_GATES.md' not in line]
          text = '\n'.join(lines).rstrip() + '\n\nProduct runtime/security contracts, including approval gates for dangerous XYOps workflows, remain with their product-domain documentation owners rather than `docs/ai/`.\n'
          p.write_text(text)
          PY

          rm .github/workflows/rebuild-448-correction.yml
          test -s docs/APPROVAL_GATES.md
          test ! -e docs/ai/APPROVAL_GATES.md
          grep -Fq 'Product runtime/security contracts' docs/ai/README.md
          git add -A
          git diff --cached --check
          git commit -m 'docs: restore approval gates product ownership'
          git push origin HEAD:docs/268-ai-policy-owner
