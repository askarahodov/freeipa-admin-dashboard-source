name: One-shot React security lockfile maintenance

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/react-server-dom-1928]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Update React Server Components binding
        run: npm install --save-dev --package-lock-only react-server-dom-webpack@19.2.8
      - name: Commit generated dependency update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: update react-server-dom-webpack to 19.2.8"
          git push

# Temporary one-shot maintenance workflow; remove before merge.
