name: RBAC one-shot branch patch

on:
  push:
    branches:
      - agent/rbac-owner-consolidation

permissions:
  contents: write

jobs:
  patch-worker-index:
    if: github.ref == 'refs/heads/agent/rbac-owner-consolidation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/rbac-owner-consolidation
          fetch-depth: 0

      - name: Apply exact RBAC ownership patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/index.ts')
          source = path.read_text()

          replacements = [
              (
                  'import { handleBackupExportRequest } from "./backup-export-entry";\n',
                  'import { handleBackupExportRequest } from "./backup-export-entry";\n'
                  'import { portalRolePermissions, resolvePortalRole, type PortalPermission, type PortalRole } from "../portal-permissions";\n',
              ),
              (
                  'type PortalRole = "viewer" | "operator" | "admin";\n'
                  'type PortalPermission = "directory.read" | "freeipa.write" | "freeipa.delete" | "xyops.run" | "xyops.approve" | "settings.manage" | "backup.export";\n\n'
                  'const rolePermissions: Record<PortalRole, PortalPermission[]> = {\n'
                  '  viewer: ["directory.read"],\n'
                  '  operator: ["directory.read", "freeipa.write", "xyops.run"],\n'
                  '  admin: ["directory.read", "freeipa.write", "freeipa.delete", "xyops.run", "xyops.approve", "settings.manage", "backup.export"],\n'
                  '};\n\n',
                  '',
              ),
              (
                  'function portalRole(value: unknown): PortalRole | null {\n'
                  '  return value === "viewer" || value === "operator" || value === "admin" ? value : null;\n'
                  '}\n\n'
                  'function portalAccess(request: Request, env: Env): { identity: string; role: PortalRole; groups: string[]; permissions: PortalPermission[] } {\n'
                  '  const identity = (request.headers.get("oai-authenticated-user-email") || "portal-user").trim().toLowerCase().slice(0, 160);\n'
                  '  const groups = Array.from(new Set(String(request.headers.get("oai-authenticated-user-groups") ?? "").split(",").map((value) => value.trim().toLowerCase()).filter((value) => value && value.length <= 120 && !/[\\r\\n]/.test(value)))).slice(0, 100);\n'
                  '  let role = portalRole(String(env.PORTAL_DEFAULT_ROLE || "").trim().toLowerCase()) ?? "admin";\n'
                  '  if (env.PORTAL_RBAC_JSON) {\n'
                  '    try {\n'
                  '      const assignments = JSON.parse(env.PORTAL_RBAC_JSON) as unknown;\n'
                  '      if (assignments && typeof assignments === "object" && !Array.isArray(assignments)) {\n'
                  '        const values = assignments as Record<string, unknown>;\n'
                  '        const normalized = Object.fromEntries(Object.entries(values).map(([key, value]) => [key.trim().toLowerCase(), value]));\n'
                  '        role = portalRole(normalized[identity]) ?? portalRole(normalized["*"]) ?? role;\n'
                  '      }\n'
                  '    } catch {\n'
                  '      // Invalid RBAC configuration never grants more than the explicit default role.\n'
                  '    }\n'
                  '  }\n'
                  '  return { identity, role, groups, permissions: rolePermissions[role] };\n'
                  '}\n',
                  'function portalAccess(request: Request, env: Env): { identity: string; role: PortalRole; groups: string[]; permissions: PortalPermission[] } {\n'
                  '  const identity = (request.headers.get("oai-authenticated-user-email") || "portal-user").trim().toLowerCase().slice(0, 160);\n'
                  '  const groups = Array.from(new Set(String(request.headers.get("oai-authenticated-user-groups") ?? "").split(",").map((value) => value.trim().toLowerCase()).filter((value) => value && value.length <= 120 && !/[\\r\\n]/.test(value)))).slice(0, 100);\n'
                  '  const role = resolvePortalRole(identity, env.PORTAL_DEFAULT_ROLE, env.PORTAL_RBAC_JSON, "admin");\n'
                  '  return { identity, role, groups, permissions: portalRolePermissions[role] };\n'
                  '}\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}')
              source = source.replace(old, new, 1)

          required = [
              'portalRolePermissions, resolvePortalRole, type PortalPermission, type PortalRole',
              'resolvePortalRole(identity, env.PORTAL_DEFAULT_ROLE, env.PORTAL_RBAC_JSON, "admin")',
              'permissions: portalRolePermissions[role]',
          ]
          forbidden = [
              'const rolePermissions:',
              'type PortalPermission = "',
              'function portalRole(value: unknown)',
          ]
          for value in required:
              if value not in source:
                  raise SystemExit(f'missing expected canonical RBAC marker: {value}')
          for value in forbidden:
              if value in source:
                  raise SystemExit(f'legacy RBAC marker remains: {value}')

          path.write_text(source)
          PY
          git diff --check

      - name: Commit patch and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rbac-one-shot-patch.yml
          git add worker/index.ts
          git diff --cached --check
          git commit -m "rbac: remove duplicate worker permission registry"
          git push origin HEAD:agent/rbac-owner-consolidation
