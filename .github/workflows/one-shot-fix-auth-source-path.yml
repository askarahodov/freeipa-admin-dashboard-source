name: one-shot fix auth source path
on:
  push:
    branches: [refactor/267-runtime-auth-owners]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot-path-fix-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/267-runtime-auth-owners
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Fix canonical source-reading path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/settings-draft-lifecycle.test.mjs')
          s = p.read_text()
          old = 'new URL("../admin-session-authorization.ts", import.meta.url)'
          new = 'new URL("../src/auth/admin-session-authorization.ts", import.meta.url)'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify failing contract
        run: node --experimental-strip-types --test tests/settings-draft-lifecycle.test.mjs
      - name: Self-clean and commit
        run: |
          rm .github/workflows/one-shot-fix-auth-source-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/settings-draft-lifecycle.test.mjs .github/workflows/one-shot-fix-auth-source-path.yml
          git commit -m 'test(auth): read canonical authorization owner [one-shot-path-fix-done]'
          git push origin HEAD:refactor/267-runtime-auth-owners
