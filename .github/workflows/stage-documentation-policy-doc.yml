name: Stage documentation policy relocation

on:
  push:
    branches:
      - docs/268-documentation-policy-development-858c

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit and relocate documentation policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo '=== inbound refs before relocation ==='
          git grep -n 'DOCUMENTATION_POLICY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-documentation-policy-doc.yml' || true
          git grep -l 'DOCUMENTATION_POLICY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-documentation-policy-doc.yml' > /tmp/docs-policy-refs.txt || true

          cp docs/DOCUMENTATION_POLICY.md docs/development/DOCUMENTATION_POLICY.md
          cat > docs/DOCUMENTATION_POLICY.md <<'EOF'
          # Relocated

          The canonical documentation policy has moved to [`development/DOCUMENTATION_POLICY.md`](development/DOCUMENTATION_POLICY.md). This compatibility pointer is retained for existing external links; do not update governance policy here.
          EOF

          python - <<'PY'
          from pathlib import Path

          refs = [Path(x.strip()) for x in Path('/tmp/docs-policy-refs.txt').read_text().splitlines() if x.strip()]
          for p in refs:
              if p == Path('docs/DOCUMENTATION_POLICY.md'):
                  continue
              text = p.read_text()
              old = text
              text = text.replace('docs/DOCUMENTATION_POLICY.md', 'docs/development/DOCUMENTATION_POLICY.md')
              if p.parent == Path('docs'):
                  text = text.replace('](DOCUMENTATION_POLICY.md)', '](development/DOCUMENTATION_POLICY.md)')
              elif p.parent == Path('docs/development'):
                  text = text.replace('](../DOCUMENTATION_POLICY.md)', '](DOCUMENTATION_POLICY.md)')
              elif str(p).startswith('docs/'):
                  text = text.replace('](../DOCUMENTATION_POLICY.md)', '](../development/DOCUMENTATION_POLICY.md)')
                  text = text.replace('](../../docs/DOCUMENTATION_POLICY.md)', '](../../docs/development/DOCUMENTATION_POLICY.md)')
              if text != old:
                  p.write_text(text)

          policy = Path('docs/development/DOCUMENTATION_POLICY.md')
          s = policy.read_text().replace('](reference/SOURCE_OF_TRUTH.md)', '](../reference/SOURCE_OF_TRUTH.md)')
          policy.write_text(s)

          idx = Path('docs/development/README.md')
          s = idx.read_text()
          entry = '- [`DOCUMENTATION_POLICY.md`](DOCUMENTATION_POLICY.md) — docs-as-code policy, active-document rules and multi-agent documentation governance.\n'
          if entry not in s:
              lines = s.splitlines(keepends=True)
              insert_at = 2 if len(lines) >= 2 else len(lines)
              lines.insert(insert_at, '\n' + entry)
              idx.write_text(''.join(lines))

          inv = Path('docs/DOCUMENTATION_INVENTORY.md')
          s = inv.read_text().replace('`docs/DOCUMENTATION_POLICY.md`', '`docs/development/DOCUMENTATION_POLICY.md`')
          inv.write_text(s)
          PY

          echo '=== refs after relocation ==='
          git grep -n 'DOCUMENTATION_POLICY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-documentation-policy-doc.yml' || true

          test -f docs/development/DOCUMENTATION_POLICY.md
          grep -Fq '# Relocated' docs/DOCUMENTATION_POLICY.md
          grep -Fq 'development/DOCUMENTATION_POLICY.md' docs/DOCUMENTATION_POLICY.md
          grep -Fq '[`DOCUMENTATION_POLICY.md`](DOCUMENTATION_POLICY.md)' docs/development/README.md

          npm ci --ignore-scripts
          npm run docs:check

          mapfile -t tests < <(git grep -l 'DOCUMENTATION_POLICY\.md' -- 'tests/*.test.mjs' || true)
          if ((${#tests[@]})); then
            printf 'focused tests: %s\n' "${tests[*]}"
            node --test "${tests[@]}"
          fi

          rm .github/workflows/stage-documentation-policy-doc.yml
          git add -A
          git diff --cached --check
          git commit -m 'docs: move documentation policy to development owner'
          git push origin HEAD:docs/268-documentation-policy-development-858c
