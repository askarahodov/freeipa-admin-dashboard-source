name: One-shot canonical documentation index labels

on:
  push:
    branches:
      - docs/268-index-canonical-labels-c26a

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Canonicalize index labels and glossary link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/README.md')
          s = p.read_text()
          replacements = {
            '[`MAINTENANCE_MODE.md`](operations/MAINTENANCE_MODE.md)': '[`operations/MAINTENANCE_MODE.md`](operations/MAINTENANCE_MODE.md)',
            '[`OFFLINE_FULL_RESTORE.md`](operations/OFFLINE_FULL_RESTORE.md)': '[`operations/OFFLINE_FULL_RESTORE.md`](operations/OFFLINE_FULL_RESTORE.md)',
            '[`LOCAL_AUTH_RBAC.md`](security/LOCAL_AUTH_RBAC.md)': '[`security/LOCAL_AUTH_RBAC.md`](security/LOCAL_AUTH_RBAC.md)',
            '[`LOCAL_ACCEPTANCE_TESTS.md`](operations/LOCAL_ACCEPTANCE_TESTS.md)': '[`operations/LOCAL_ACCEPTANCE_TESTS.md`](operations/LOCAL_ACCEPTANCE_TESTS.md)',
            '[`P0_OPERATIONAL_ACCEPTANCE.md`](operations/P0_OPERATIONAL_ACCEPTANCE.md)': '[`operations/P0_OPERATIONAL_ACCEPTANCE.md`](operations/P0_OPERATIONAL_ACCEPTANCE.md)',
            '[`GLOSSARY.md`](GLOSSARY.md)': '[`reference/GLOSSARY.md`](reference/GLOSSARY.md)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected index entry: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cat > tests/documentation-canonical-index-links.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          test('central documentation index names and links canonical moved owners directly', async () => {
            const index = await readFile(new URL('../docs/README.md', import.meta.url), 'utf8');
            const canonicalEntries = [
              '[`operations/MAINTENANCE_MODE.md`](operations/MAINTENANCE_MODE.md)',
              '[`operations/OFFLINE_FULL_RESTORE.md`](operations/OFFLINE_FULL_RESTORE.md)',
              '[`security/LOCAL_AUTH_RBAC.md`](security/LOCAL_AUTH_RBAC.md)',
              '[`operations/LOCAL_ACCEPTANCE_TESTS.md`](operations/LOCAL_ACCEPTANCE_TESTS.md)',
              '[`operations/P0_OPERATIONAL_ACCEPTANCE.md`](operations/P0_OPERATIONAL_ACCEPTANCE.md)',
              '[`reference/GLOSSARY.md`](reference/GLOSSARY.md)',
            ];
            for (const entry of canonicalEntries) assert.ok(index.includes(entry), `missing canonical index entry ${entry}`);

            const staleEntries = [
              '[`MAINTENANCE_MODE.md`](operations/MAINTENANCE_MODE.md)',
              '[`OFFLINE_FULL_RESTORE.md`](operations/OFFLINE_FULL_RESTORE.md)',
              '[`LOCAL_AUTH_RBAC.md`](security/LOCAL_AUTH_RBAC.md)',
              '[`LOCAL_ACCEPTANCE_TESTS.md`](operations/LOCAL_ACCEPTANCE_TESTS.md)',
              '[`P0_OPERATIONAL_ACCEPTANCE.md`](operations/P0_OPERATIONAL_ACCEPTANCE.md)',
              '[`GLOSSARY.md`](GLOSSARY.md)',
            ];
            for (const entry of staleEntries) assert.ok(!index.includes(entry), `central index must not present compatibility-path entry ${entry}`);
          });
          EOF
      - name: Validate canonical index batch
        run: |
          npm run docs:check
          node --test tests/documentation-canonical-index-links.test.mjs tests/glossary-reference-ownership.test.mjs
          git diff --check
      - name: Commit final self-cleaned batch
        run: |
          rm .github/workflows/one-shot-268-index-canonical-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/README.md tests/documentation-canonical-index-links.test.mjs .github/workflows/one-shot-268-index-canonical-labels.yml
          git commit -m 'docs: normalize canonical index labels'
          git push
