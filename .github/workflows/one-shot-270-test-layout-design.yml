name: One-shot test layout design validation

on:
  push:
    branches:
      - repo/270-test-layout-design

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo/270-test-layout-design
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate design slice
        run: |
          set -euo pipefail
          npm run docs:check
          node --test tests/test-layout-policy.test.mjs
          git diff --check origin/main...HEAD
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-270-test-layout-design.yml
          git commit -m "ci: remove one-shot test layout validation"
          git push origin HEAD:repo/270-test-layout-design
