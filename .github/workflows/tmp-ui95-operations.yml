name: Temporary UI95 Operations Migration
on:
  push:
    branches: [ui-95-operations-data-list]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-95-operations-data-list
      - name: Migrate Operations presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/operations/OperationsApprovalsScreens.tsx')
          s=p.read_text()
          anchor='import { useState } from "react";\n'
          if 'from "../ui"' not in s:
            s=s.replace(anchor, anchor+'import { Button, DataListPage, DataListState, DataTable } from "../ui";\n')
          start=s.index('export function Operations(')
          end=s.index('\nfunction RunDetails(', start)
          replacement='''export function Operations({ runs, stats, loading, refresh, onAction }: { runs: RunRecord[]; stats: RunStats; loading: boolean; refresh: () => void; onAction: (run: RunRecord, action: "cancel" | "rerun") => Promise<boolean> }) {
  const [selectedId, setSelectedId] = useState<string | null>(null);
  const selected = runs.find((run) => run.id === selectedId) ?? null;
  return <><DataListPage title="Журнал операций" description="Прямые изменения FreeIPA и запуски автоматизаций XYOps" actions={<Button variant="secondary" disabled={loading} onClick={refresh}>{loading ? "Обновление…" : "Обновить"}</Button>}><div className="stats-strip"><span><b>{stats.today}</b> операций сегодня</span><span><i className="dot green" /><b>{stats.success}</b> успешно</span><span><i className="dot amber" /><b>{stats.queued}</b> выполняются</span><span><i className="dot red-dot" /><b>{stats.failed}</b> ошибки</span></div>{runs.length === 0 ? <DataListState kind="empty" title="Операций пока нет" description="Запуски Events и Workflows появятся здесь автоматически." /> : <DataTable label="Журнал операций"><thead><tr><th>Операция</th><th>Объект</th><th>Статус</th><th>Инициатор</th><th>Время</th><th>Job</th></tr></thead><tbody>{runs.map((run) => <tr className="selectable-run" key={run.id} title={run.error ?? ""} onClick={() => setSelectedId(run.id)}><td><span className="operation"><i className={run.status}>↗</i>{run.title}</span></td><td>{run.subject}</td><td><RunStatusBadge status={run.status} /></td><td>{run.actor}</td><td><strong>{new Date(run.startedAt).toLocaleTimeString("ru-RU")}</strong><small>{new Date(run.startedAt).toLocaleDateString("ru-RU")}</small></td><td className="mono">{run.jobId}</td></tr>)}</tbody></DataTable>}</DataListPage>{selected && <RunDetails run={selected} close={() => setSelectedId(null)} onAction={onAction} />}</>;
}
'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/operations/OperationsApprovalsScreens.tsx
          git commit -m "ui: migrate Operations to shared data-list pattern"
          git push
