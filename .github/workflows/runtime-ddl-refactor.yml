name: Runtime DDL Refactor

on:
  push:
    branches:
      - agent/remove-runtime-schema-ddl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-ddl-refactor
  cancel-in-progress: false

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-runtime-schema-ddl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove runtime schema DDL
        run: node scripts/remove-runtime-schema-ddl.mjs
      - name: Verify source contract
        run: node --experimental-strip-types --test tests/runtime-schema-ddl-contract.test.mjs
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts'
          git commit -m "refactor: remove runtime schema DDL"
          git push origin HEAD:agent/remove-runtime-schema-ddl
