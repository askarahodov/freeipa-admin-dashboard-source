name: API Route Doc Sync

on:
  push:
    branches:
      - agent/api-route-contract

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-route-contract
          fetch-depth: 0
      - name: Apply verified documentation replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/reference/API.md",
              "It does **not** replace runtime routing. Current routing is distributed across the Worker wrapper chain and route-specific modules; a single machine-readable route registry is tracked by **#121**. When this document and current code disagree, verify the exact handler and its tests first.",
              "It does **not** replace runtime routing. `portal-route-contract.ts` is the canonical machine-readable owner for normalized route metadata such as method, path pattern, handler owner, auth boundary, canonical permission, mutation classification and local-admin same-origin classification. Existing Worker handlers/wrappers remain the runtime owners of dispatch, validation and responses. When the registry, this document and current code disagree, treat that as drift and verify the exact handler/tests before changing behavior.",
          )
          replace_once(
              "docs/reference/API.md",
              "route-local legacy/orphan `backup.restore.preview`; admin",
              "canonical `backup.restore.preview`; admin",
          )
          replace_once(
              "docs/reference/API.md",
              "## Known route-registry limitation\n\nThere is currently no single declarative runtime registry containing every method/path/auth/permission contract. Routing is distributed between `worker/index.ts`, wrapper entry modules and route constants. Follow-up **#121** tracks a machine-readable route contract suitable for drift checks and future documentation generation.\n\nUntil #121 is resolved:\n\n- use this file as a normalized orientation reference;\n- verify the exact current handler and test before modifying a route;\n- do not use `/api/integrations/routes` as an HTTP API registry;\n- do not add a second endpoint when an existing capability can be extended;\n- when a route changes, update its handler/tests and this reference in the same PR.",
              "## Machine-readable route metadata\n\n`portal-route-contract.ts` is the canonical declarative inventory for stable HTTP route metadata. It intentionally does **not** dispatch requests or duplicate request/response schemas: routing behavior remains distributed across the current Worker wrapper chain and domain handlers until the separate #56 refactor changes that architecture.\n\nWhen a route changes:\n\n- update the runtime handler and behavior tests first;\n- update `portal-route-contract.ts` in the same PR;\n- update this normalized human reference when the operator/developer-facing contract changes;\n- do not use `/api/integrations/routes` as an HTTP API registry — it is XYOps automation-routing configuration;\n- do not add a second endpoint when an existing capability can be extended.\n\nThe route contract is intended to become an input to #56 route/middleware parity checks, not a second router.",
          )

          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "| Built-in roles/permissions | runtime permission checks and auth boundary | `LOCAL_AUTH_RBAC.md`, README overview | Требуется отдельный normalized permission registry/reference в Epic #82/#39 |",
              "| Built-in roles/permissions | `portal-permissions.ts` | `LOCAL_AUTH_RBAC.md`, `reference/PERMISSIONS.md` | Route handlers consume canonical role/permission helpers; purpose-specific service/recovery authorization остаётся отдельным механизмом |",
          )
          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "| HTTP/API routes | фактический Worker/router/entry chain + route tests | README содержит только high-level список | Полный declarative API inventory ещё отсутствует и является документальным gap |",
              "| HTTP/API route metadata | `portal-route-contract.ts` для method/path/owner/auth/permission/mutation metadata; фактические Worker handlers/tests для поведения | `reference/API.md` | Registry не является runtime router и не владеет request/response schemas; #56 может использовать его как parity inventory |",
          )
          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "Маршруты и permission checks распределены по Worker entry/wrapper chain. До рефакторинга #56 и отдельного route inventory нельзя вручную объявить новый Markdown-файл единственным source of truth. Documentation должна ссылаться на фактические handlers и tests.",
              "Built-in roles/permissions имеют единый runtime owner `portal-permissions.ts`. Stable route metadata имеет единый machine-readable owner `portal-route-contract.ts`. При этом фактический dispatch, middleware order, request validation и response behavior пока остаются распределены по Worker entry/wrapper chain и подтверждаются handler/tests. До #56 нельзя трактовать metadata registry как runtime router или переносить поведение в него.",
          )

          replace_once(
              "docs/ai/README.md",
              "Не используйте `/api/integrations/routes` как доказательство существования глобального HTTP route registry: это XYOps routing configuration. Машиночитаемый HTTP registry остаётся отдельной задачей #121.",
              "Не используйте `/api/integrations/routes` как глобальный HTTP registry: это XYOps routing configuration. Canonical machine-readable HTTP route metadata живёт в `portal-route-contract.ts`; runtime dispatch по-прежнему остаётся в текущих Worker handlers/wrappers.",
          )
          replace_once(
              "docs/ai/README.md",
              "Известный distributed/orphan RBAC drift отслеживается в #119. Не «исправляйте» route-local checks удалением или легализацией через новый документ; сначала определите корректный runtime owner и tests.",
              "Canonical built-in RBAC ownership консолидирован в `portal-permissions.ts`. Не создавайте route-local permission vocabulary; если route требует отсутствующий permission, изменяйте canonical registry и behavior tests явно.",
          )

          workflow = Path(".github/workflows/api-route-doc-sync.yml")
          workflow.unlink()
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/API.md docs/SOURCE_OF_TRUTH.md docs/ai/README.md .github/workflows/api-route-doc-sync.yml
          git diff --cached --check
          git commit -m "docs: wire canonical API route metadata ownership"
          git push origin HEAD:agent/api-route-contract
