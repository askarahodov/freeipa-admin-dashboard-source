name: One-shot #268 AI policy owner

on:
  push:
    branches:
      - docs/268-ai-policy-owner

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Move AI policy documentation family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ai
          cp docs/AI_AGENT_WORKFLOW.md docs/ai/AI_AGENT_WORKFLOW.md
          cp docs/APPROVAL_GATES.md docs/ai/APPROVAL_GATES.md

          cat > docs/AI_AGENT_WORKFLOW.md <<'EOF'
          # Relocated

          The canonical document has moved to [`ai/AI_AGENT_WORKFLOW.md`](ai/AI_AGENT_WORKFLOW.md). This compatibility pointer is retained for existing external links; do not update AI-agent delivery policy here.
          EOF
          cat > docs/APPROVAL_GATES.md <<'EOF'
          # Relocated

          The canonical document has moved to [`ai/APPROVAL_GATES.md`](ai/APPROVAL_GATES.md). This compatibility pointer is retained for existing external links; do not update approval-gate policy here.
          EOF

          python <<'PY'
          from pathlib import Path

          root = Path('.')
          moved = {
              'AI_AGENT_WORKFLOW.md': 'ai/AI_AGENT_WORKFLOW.md',
              'APPROVAL_GATES.md': 'ai/APPROVAL_GATES.md',
          }
          canonical = {
              Path('docs/ai/AI_AGENT_WORKFLOW.md'),
              Path('docs/ai/APPROVAL_GATES.md'),
              Path('docs/AI_AGENT_WORKFLOW.md'),
              Path('docs/APPROVAL_GATES.md'),
          }
          suffixes = {'.md', '.mjs', '.js', '.ts', '.tsx', '.yml', '.yaml', '.json'}
          skip_prefixes = ('docs/superpowers/', '.git/', 'node_modules/')
          for path in root.rglob('*'):
              if not path.is_file() or path in canonical or path.suffix not in suffixes:
                  continue
              s = path.as_posix()
              if s.startswith(skip_prefixes):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new_rel in moved.items():
                  text = text.replace(f'docs/{old}', f'docs/{new_rel}')
                  if s.startswith('docs/'):
                      text = text.replace(f']({old})', f']({new_rel})')
                      text = text.replace(f'`{old}`', f'`{new_rel}`')
              text = text.replace(r'docs\/AI_AGENT_WORKFLOW\.md', r'docs\/ai\/AI_AGENT_WORKFLOW\.md')
              text = text.replace(r'docs\/APPROVAL_GATES\.md', r'docs\/ai\/APPROVAL_GATES\.md')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          readme = Path('docs/ai/README.md')
          text = readme.read_text(encoding='utf-8')
          additions = (
              '\n## Canonical AI delivery policy\n\n'
              '- [`AI_AGENT_WORKFLOW.md`](AI_AGENT_WORKFLOW.md) — mandatory AI-agent delivery workflow, testing, review and checkpoint policy.\n'
              '- [`APPROVAL_GATES.md`](APPROVAL_GATES.md) — approval boundaries and execution gates for automated/agent work.\n'
          )
          if 'AI_AGENT_WORKFLOW.md`](AI_AGENT_WORKFLOW.md)' not in text:
              readme.write_text(text.rstrip() + additions, encoding='utf-8')
          PY

      - name: Validate AI policy documentation batch
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          mapfile -t tests < <(grep -rlE 'AI_AGENT_WORKFLOW|APPROVAL_GATES' tests --include='*.test.mjs' --include='*.test.js' | sort -u || true)
          if (( ${#tests[@]} )); then
            node --experimental-strip-types --test --test-concurrency=1 "${tests[@]}"
          fi
          git diff --check
          test -s docs/ai/AI_AGENT_WORKFLOW.md
          test -s docs/ai/APPROVAL_GATES.md
          grep -q 'ai/AI_AGENT_WORKFLOW.md' docs/AI_AGENT_WORKFLOW.md
          grep -q 'ai/APPROVAL_GATES.md' docs/APPROVAL_GATES.md

      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-ai-policy-owner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes produced'
            exit 1
          fi
          git commit -m 'docs: move AI policy family to canonical owner'
          git push origin HEAD:docs/268-ai-policy-owner
