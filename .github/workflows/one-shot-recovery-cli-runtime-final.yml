name: One-shot final recovery CLI runtime

on:
  push:
    branches: [refactor/266-recovery-cli-runtime-final]
    paths: [.github/workflows/one-shot-recovery-cli-runtime-final.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: package.json }
      - name: Apply final recovery ownership move
        run: python .github/scripts/apply-recovery-cli-runtime-final.py
      - name: Run focused recovery CLI/runtime coverage
        run: >-
          node --experimental-strip-types --test
          tests/recovery-cli-runtime-domain-path-contract.test.mjs
          tests/recovery-cli-source.test.mjs
          tests/recovery-cli.test.mjs
          tests/recovery-maintenance.test.mjs
          tests/recovery-online-verification.test.mjs
          tests/recovery-runtime-lock-source.test.mjs
          tests/recovery-fault-matrix.test.mjs
          tests/recovery-preflight.test.mjs
          tests/recovery-reconcile.test.mjs
          tests/recovery-swap.test.mjs
          tests/recovery-point.test.mjs
      - name: Verify final root cleanup
        run: |
          git diff --check
          test -z "$(find . -maxdepth 1 -type f \( -name 'recovery-*.ts' -o -name 'maintenance-*.ts' \) -print -quit)"
      - name: Remove one-shot tooling and commit final batch
        run: |
          rm .github/scripts/apply-recovery-cli-runtime-final.py
          rm .github/workflows/one-shot-recovery-cli-runtime-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(recovery): complete canonical ownership"
          git push origin HEAD:refactor/266-recovery-cli-runtime-final
