name: One-shot #270 recursive discovery

on:
  push:
    branches: [repo/270-recursive-test-discovery]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate recursive discovery slice
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/discover-node-tests.mjs
          node --check scripts/run-node-tests.mjs
          node scripts/discover-node-tests.mjs > /tmp/node-tests.txt
          test -s /tmp/node-tests.txt
          node --test tests/node-test-discovery.test.mjs tests/test-layout-policy.test.mjs
          npm run docs:check
          git diff --check origin/main...HEAD

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-270-recursive-discovery.yml
          git commit -m "chore: remove recursive discovery one-shot"
          git push
