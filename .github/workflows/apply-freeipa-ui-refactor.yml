name: Apply FreeIPA UI Refactor

on:
  push:
    branches:
      - agent/playwright-freeipa-crud-e2e
    paths:
      - scripts/apply_freeipa_ui_refactor.py
      - .github/workflows/apply-freeipa-ui-refactor.yml

permissions:
  contents: write

concurrency:
  group: apply-freeipa-ui-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/playwright-freeipa-crud-e2e
          fetch-depth: 0

      - name: Apply verified codemod
        run: python3 scripts/apply_freeipa_ui_refactor.py

      - name: Validate generated diff
        run: |
          git diff --check
          test -f freeipa-ui-events.ts
          test ! -e app/FreeIpaDirectorySync.tsx
          test ! -e app/FreeIpaLegacyActionBridge.tsx
          ! grep -R "clickLegacy\|legacyRemove\|lastFreeIpaToast" app/FreeIpaUserBrowser.tsx app/FreeIpaGroupMemberBrowser.tsx

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: decouple FreeIPA UI from legacy DOM actions"
          git push origin HEAD:agent/playwright-freeipa-crud-e2e
