name: Runtime DDL Finalize

on:
  push:
    branches:
      - agent/remove-runtime-schema-ddl

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-runtime-schema-ddl
      - name: Remove remaining deleted DDL references
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/index.ts')
          text = path.read_text()
          lines = [line for line in text.splitlines(True) if 'prepare(createSettingsTable)' not in line]
          updated = ''.join(lines)
          if updated == text:
              raise SystemExit('createSettingsTable reference not found')
          path.write_text(updated)
          PY
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts
          git commit -m "refactor: remove remaining runtime settings DDL references"
          git push origin HEAD:agent/remove-runtime-schema-ddl
      - name: Verify focused regressions
        run: |
          npm run install:ci
          npm run build
          node --experimental-strip-types --test tests/runtime-schema-ddl-contract.test.mjs tests/persistent-settings.test.mjs tests/catalog-scheduled-sync.test.mjs tests/xyops-catalog-api.test.mjs
