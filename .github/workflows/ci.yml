name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - id: list
        name: Discover and shard test files
        shell: bash
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.test.mjs' -print | sort > "$RUNNER_TEMP/server-tests.txt"
          node scripts/ci-test-shards.mjs \
            --input "$RUNNER_TEMP/server-tests.txt" \
            --github-output "$GITHUB_OUTPUT" \
            --max-shards 8

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Enforce production audit policy
        run: npm run security:audit

      - name: Generate production CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          npm run --silent security:sbom > artifacts/security/npm-production-sbom.cdx.json
          node -e 'const fs=require("fs"); const bom=JSON.parse(fs.readFileSync("artifacts/security/npm-production-sbom.cdx.json","utf8")); if (bom.bomFormat !== "CycloneDX" || !Array.isArray(bom.components)) process.exit(1)'

      - name: Upload production SBOM
        uses: actions/upload-artifact@v4
        with:
          name: npm-production-sbom
          path: artifacts/security/npm-production-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Create source snapshot
        shell: bash
        run: tar -czf "$RUNNER_TEMP/source-snapshot.tar.gz" --exclude=.git --exclude=node_modules --exclude=dist .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production dependency tree
        run: npm ls --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  container-security:
    name: Runtime image security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Build runtime image
        run: docker build --target runtime -t portal-security-scan .

      - name: Prepare security artifacts
        run: mkdir -p artifacts/security

      - name: Scan fixable runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: portal-security-scan
          format: json
          output: artifacts/security/runtime-image-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'

      - name: Upload runtime image scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-security-scan
          path: artifacts/security/runtime-image-trivy.json
          if-no-files-found: warn
          retention-days: 14

  recovery-compose:
    name: Test recovery container and volume
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run recovery contracts
        run: node --experimental-strip-types --test tests/recovery-container-contract.test.mjs tests/recovery-compose-smoke.test.mjs tests/recovery-fault-matrix.test.mjs

      - name: Build isolated recovery image
        run: docker build --target recovery -t portal-recovery-ci .

      - name: Run disposable named-volume smoke
        run: npm run test:recovery:compose

  test:
    name: Test shard ${{ matrix.shard.name }}
    needs: [discover-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover-tests.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run shard
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          TEST_FILES_JSON: ${{ toJSON(matrix.shard.files) }}
        run: |
          set -euo pipefail
          mapfile -t test_files < <(node -e 'for (const file of JSON.parse(process.env.TEST_FILES_JSON || "[]")) console.log(file)')
          if (( ${#test_files[@]} == 0 )); then
            echo "Shard ${SHARD_NAME} contains no test files"
            exit 1
          fi
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=1 "${test_files[@]}" 2>&1 | tee "server-shard-${SHARD_NAME}.tap"

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-shard-${{ matrix.shard.name }}-log
          path: server-shard-${{ matrix.shard.name }}.tap
          if-no-files-found: error
          retention-days: 1

  required:
    name: Required CI
    if: always()
    needs: [discover-tests, dependency-security, build, container-security, recovery-compose, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required CI jobs succeeded
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover-tests.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
          RECOVERY_RESULT: ${{ needs.recovery-compose.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          for result in "$DISCOVER_RESULT" "$SECURITY_RESULT" "$BUILD_RESULT" "$CONTAINER_RESULT" "$RECOVERY_RESULT" "$TEST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI dependency finished with result: $result"
              exit 1
            fi
          done
