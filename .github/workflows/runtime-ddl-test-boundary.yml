name: Runtime DDL Test Boundary

on:
  push:
    branches:
      - agent/remove-runtime-schema-ddl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-runtime-schema-ddl
      - name: Mark scheduled-sync fake D1 as migrated
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/catalog-scheduled-sync.test.mjs')
          text = path.read_text()
          text = text.replace(
              'import worker from "../dist/server/index.js";\n',
              'import worker from "../dist/server/index.js";\nimport { markSchemaTestBypass } from "../worker/schema-migrations-boundary.ts";\n',
          )
          text = text.replace(
              'function adminEnv(db, values = {}) {\n  return {',
              'function adminEnv(db, values = {}) {\n  return markSchemaTestBypass({',
          )
          text = text.replace(
              '    ...values,\n  };\n}\n\nfunction context',
              '    ...values,\n  });\n}\n\nfunction context',
          )
          path.write_text(text)
          PY
      - name: Commit boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-scheduled-sync.test.mjs
          git commit -m "test: mark scheduled catalog D1 as schema-ready"
          git push origin HEAD:agent/remove-runtime-schema-ddl
      - name: Verify focused test
        run: |
          npm run install:ci
          npm run build
          node --experimental-strip-types --test tests/runtime-schema-ddl-contract.test.mjs tests/catalog-scheduled-sync.test.mjs
