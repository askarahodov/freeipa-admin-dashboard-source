name: Runtime DDL Test Fix

on:
  push:
    branches:
      - agent/remove-runtime-schema-ddl

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-runtime-schema-ddl
      - name: Move DDL ownership assertions to canonical schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/settings-draft-lifecycle.test.mjs')
          text = path.read_text()
          text = text.replace(
              'const workflowUrl = new URL("../.github/workflows/e2e-auth.yml", import.meta.url);',
              'const workflowUrl = new URL("../.github/workflows/e2e-auth.yml", import.meta.url);\nconst portalSchemaUrl = new URL("../db/portal-schema.ts", import.meta.url);',
          )
          text = text.replace(
              'const workflow = fs.readFileSync(workflowUrl, "utf8");',
              'const workflow = fs.readFileSync(workflowUrl, "utf8");\nconst portalSchema = fs.readFileSync(portalSchemaUrl, "utf8");',
          )
          replacements = {
              'lifecycle.includes("CREATE TABLE IF NOT EXISTS portal_settings_drafts")': 'portalSchema.includes("CREATE TABLE IF NOT EXISTS portal_settings_drafts")',
              'lifecycle.includes("base_revision INTEGER NOT NULL")': 'portalSchema.includes("base_revision INTEGER NOT NULL")',
              'lifecycle.includes(\'CREATE TABLE IF NOT EXISTS portal_settings_apply_commits\')': 'portalSchema.includes(\'CREATE TABLE IF NOT EXISTS portal_settings_apply_commits\')',
              'source.includes("CREATE TABLE IF NOT EXISTS portal_settings_source_lock")': 'portalSchema.includes("CREATE TABLE IF NOT EXISTS portal_settings_source_lock")',
              'revisions.includes("CREATE TABLE IF NOT EXISTS portal_settings_revisions")': 'portalSchema.includes("CREATE TABLE IF NOT EXISTS portal_settings_revisions")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected assertion: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Verify focused contracts
        run: node --experimental-strip-types --test tests/settings-draft-lifecycle.test.mjs tests/runtime-schema-ddl-contract.test.mjs
      - name: Commit test migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/settings-draft-lifecycle.test.mjs
          git commit -m "test: assert settings schema through canonical inventory"
          git push origin HEAD:agent/remove-runtime-schema-ddl
