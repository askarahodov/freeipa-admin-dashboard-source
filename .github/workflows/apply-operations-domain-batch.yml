name: Apply operations domain batch

on:
  push:
    branches:
      - refactor/262-operations-domain-batch
    paths:
      - .github/workflows/apply-operations-domain-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: refactor/262-operations-domain-batch
          fetch-depth: 0

      - name: Apply dependency-closed operations move
        run: python3 .github/scripts/apply-operations-domain-batch.py

      - name: Validate generated source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e approval-gates.ts
          test ! -e catalog-policies.ts
          test ! -e operation-explorer.ts
          test ! -e operation-explorer-legacy-bridge.ts
          test ! -e process-presentation.ts
          test ! -e run-notifications.ts
          test ! -e run-replays.ts
          test ! -e run-results.ts
          node --experimental-strip-types --test \
            tests/operation-explorer-query.test.mjs \
            tests/operation-explorer-ui.test.mjs \
            tests/operation-explorer-legacy-bridge.test.mjs \
            tests/operation-explorer-domain-path-contract.test.mjs \
            tests/operations-domain-path-contract.test.mjs \
            tests/auth-e2e-routing.test.mjs \
            tests/test-scope-routing.test.mjs

      - name: Remove one-shot migration machinery
        run: |
          rm -f .github/scripts/apply-operations-domain-batch.py
          rm -f .github/workflows/apply-operations-domain-batch.yml

      - name: Commit operations ownership batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor(operations): establish canonical domain ownership"
          git push origin HEAD:refactor/262-operations-domain-batch
