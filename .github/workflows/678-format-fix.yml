name: "#678 format fix"

on:
  push:
    branches:
      - tmp/678-format-fix

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/632-approval-http-owner
          fetch-depth: 0
      - name: Fix approval dispatch indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("worker/operations-http-entry.ts")
          lines = path.read_text().splitlines()
          start_marker = '    if (request.method === "GET" && url.pathname === "/api/integrations/approvals") {'
          end_marker = '    if (request.method === "GET" && url.pathname === "/api/integrations/notifications") {'
          start = lines.index(start_marker)
          end = lines.index(end_marker, start + 1)
          for index in range(start + 1, end):
              if lines[index]:
                  lines[index] = "  " + lines[index]
          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/operations-http-entry.ts
          git commit -m "style(worker): align approval dispatch block"
          git push origin HEAD:arch/632-approval-http-owner
