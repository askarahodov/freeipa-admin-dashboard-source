name: One-shot 270 portal test family

on:
  push:
    branches:
      - repo/270-portal-test-family

permissions:
  contents: write

jobs:
  relocate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move complete portal test family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/portal
          count=$(find tests -maxdepth 1 -type f -name 'portal-*.test.mjs' | wc -l)
          test "$count" -eq 21
          git mv tests/portal-*.test.mjs tests/portal/
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path('tests/portal').glob('portal-*.test.mjs')):
              text = path.read_text()
              text = text.replace('from "../', 'from "../../')
              text = text.replace("from '../", "from '../../")
              text = text.replace('new URL("../', 'new URL("../../')
              text = text.replace("new URL('../", "new URL('../../")
              text = text.replace('new URL(`../', 'new URL(`../../')
              text = text.replace('path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..")', 'path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../..")')
              path.write_text(text)

          scope = Path('scripts/auth-e2e-scope.mjs')
          text = scope.read_text().replace('tests/portal-', 'tests/portal/portal-')
          scope.write_text(text)

          routing = Path('tests/test-scope-routing.test.mjs')
          text = routing.read_text().replace('tests/portal-', 'tests/portal/portal-')
          routing.write_text(text)
          PY

      - name: Build
        run: npm run build

      - name: Run complete portal family and routing contracts
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/portal/*.test.mjs
          node --test tests/test-scope-routing.test.mjs tests/node-test-discovery.test.mjs tests/test-layout-policy.test.mjs

      - name: Validate relocation invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tests/portal -maxdepth 1 -type f -name 'portal-*.test.mjs' | wc -l)" -eq 21
          test "$(find tests -maxdepth 1 -type f -name 'portal-*.test.mjs' | wc -l)" -eq 0
          test "$(grep -c 'tests/portal/portal-' scripts/auth-e2e-scope.mjs)" -eq 4
          ! grep -Eq 'tests/portal-(schema-inventory|schema-migrations|schema-review-hardening|schema-boundary)\.test\.mjs' scripts/auth-e2e-scope.mjs tests/test-scope-routing.test.mjs
          git diff --check

      - name: Commit validated relocation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-270-portal-family.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: move portal test family under domain owner"
          git push origin HEAD:repo/270-portal-test-family
