name: One-shot #268 architecture core family migration

on:
  push:
    branches:
      - docs/268-architecture-core-family

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move architecture documentation family and update active inbound links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for name in ['ARCHITECTURE.md','PROJECT_STRUCTURE.md','MODULE_COVERAGE.md']:
              src=Path('docs')/name
              dst=Path('docs/architecture')/name
              text=src.read_text()
              if name == 'ARCHITECTURE.md':
                  repl={
                    '](SOURCE_OF_TRUTH.md)': '](../SOURCE_OF_TRUTH.md)',
                    '](DATABASE_MIGRATIONS.md)': '](../DATABASE_MIGRATIONS.md)',
                    '](GLOSSARY.md)': '](../GLOSSARY.md)',
                    '](HEALTH_CONTRACTS.md)': '](../HEALTH_CONTRACTS.md)',
                    '](HEALTH_METRICS.md)': '](../HEALTH_METRICS.md)',
                    '](MAINTENANCE_MODE.md)': '](../MAINTENANCE_MODE.md)',
                    '](OFFLINE_FULL_RESTORE.md)': '](../OFFLINE_FULL_RESTORE.md)',
                    '](STORAGE_INTEGRITY.md)': '](../STORAGE_INTEGRITY.md)',
                    '](STORAGE_STATUS.md)': '](../STORAGE_STATUS.md)',
                    '](XYOPS_EXECUTION_OWNERSHIP.md)': '](../XYOPS_EXECUTION_OWNERSHIP.md)',
                    '](ai/README.md)': '](../ai/README.md)',
                  }
              elif name == 'PROJECT_STRUCTURE.md':
                  repl={
                    '](DOCUMENTATION_POLICY.md)': '](../DOCUMENTATION_POLICY.md)',
                    '](GLOSSARY.md)': '](../GLOSSARY.md)',
                    '](SOURCE_OF_TRUTH.md)': '](../SOURCE_OF_TRUTH.md)',
                    '](ai/README.md)': '](../ai/README.md)',
                  }
              else:
                  repl={}
              for a,b in repl.items(): text=text.replace(a,b)
              dst.write_text(text)
              src.write_text(f'# Relocated\n\nThe canonical document has moved to [`architecture/{name}`](architecture/{name}). This compatibility pointer is retained for existing external links; do not update policy here.\n')

          replacements = {
           'scripts/pr-collision-guard.mjs': {
             '"docs/ARCHITECTURE.md"':'"docs/architecture/ARCHITECTURE.md"',
             '"docs/PROJECT_STRUCTURE.md"':'"docs/architecture/PROJECT_STRUCTURE.md"',
           },
           'tests/documentation-architecture-map.test.mjs': {
             'read("docs/ARCHITECTURE.md")':'read("docs/architecture/ARCHITECTURE.md")',
             'read("docs/PROJECT_STRUCTURE.md")':'read("docs/architecture/PROJECT_STRUCTURE.md")',
             r'/\[`ARCHITECTURE\.md`\]\(ARCHITECTURE\.md\)/': r'/\[`ARCHITECTURE\.md`\]\(architecture\/ARCHITECTURE\.md\)/',
             r'/\[`PROJECT_STRUCTURE\.md`\]\(PROJECT_STRUCTURE\.md\)/': r'/\[`PROJECT_STRUCTURE\.md`\]\(architecture\/PROJECT_STRUCTURE\.md\)/',
             r'/\[`ARCHITECTURE\.md`\]\(\.\.\/ARCHITECTURE\.md\)/': r'/\[`ARCHITECTURE\.md`\]\(\.\.\/architecture\/ARCHITECTURE\.md\)/',
             r'/\[`PROJECT_STRUCTURE\.md`\]\(\.\.\/PROJECT_STRUCTURE\.md\)/': r'/\[`PROJECT_STRUCTURE\.md`\]\(\.\.\/architecture\/PROJECT_STRUCTURE\.md\)/',
             r'/`docs\/ARCHITECTURE\.md`[\s\S]*`verified-active`/': r'/`docs\/architecture\/ARCHITECTURE\.md`[\s\S]*`verified-active`/',
             r'/`docs\/PROJECT_STRUCTURE\.md`[\s\S]*`verified-active`/': r'/`docs\/architecture\/PROJECT_STRUCTURE\.md`[\s\S]*`verified-active`/',
           },
           'tests/pr-collision-guard.test.mjs': {
             '"docs/ARCHITECTURE.md", "docs/PROJECT_STRUCTURE.md"':'"docs/architecture/ARCHITECTURE.md", "docs/architecture/PROJECT_STRUCTURE.md"',
           },
           'runtime/README.md': {
             '`docs/ARCHITECTURE.md`':'`docs/architecture/ARCHITECTURE.md`',
           },
           'docs/README.md': {
             '](ARCHITECTURE.md)':'](architecture/ARCHITECTURE.md)',
             '](PROJECT_STRUCTURE.md)':'](architecture/PROJECT_STRUCTURE.md)',
             '](MODULE_COVERAGE.md)':'](architecture/MODULE_COVERAGE.md)',
           },
           'docs/architecture/README.md': {
             '[`../ARCHITECTURE.md`](../ARCHITECTURE.md)':'[`ARCHITECTURE.md`](ARCHITECTURE.md)',
             '[`../PROJECT_STRUCTURE.md`](../PROJECT_STRUCTURE.md)':'[`PROJECT_STRUCTURE.md`](PROJECT_STRUCTURE.md)',
             '[`../MODULE_COVERAGE.md`](../MODULE_COVERAGE.md)':'[`MODULE_COVERAGE.md`](MODULE_COVERAGE.md)',
           },
           'docs/ai/README.md': {
             '](../ARCHITECTURE.md)':'](../architecture/ARCHITECTURE.md)',
             '](../PROJECT_STRUCTURE.md)':'](../architecture/PROJECT_STRUCTURE.md)',
           },
           'docs/DOCUMENTATION_INVENTORY.md': {
             '`docs/ARCHITECTURE.md`':'`docs/architecture/ARCHITECTURE.md`',
             '`docs/PROJECT_STRUCTURE.md`':'`docs/architecture/PROJECT_STRUCTURE.md`',
             '`docs/MODULE_COVERAGE.md`':'`docs/architecture/MODULE_COVERAGE.md`',
           },
           'docs/adr/README.md': {
             '`docs/ARCHITECTURE.md`':'`docs/architecture/ARCHITECTURE.md`',
           },
           'docs/reference/PERMISSIONS.md': {
             '](../ARCHITECTURE.md)':'](../architecture/ARCHITECTURE.md)',
           },
           'docs/reference/API.md': {
             '](../ARCHITECTURE.md)':'](../architecture/ARCHITECTURE.md)',
           },
           'docs/SECURITY_MODEL.md': {
             '](ARCHITECTURE.md)':'](architecture/ARCHITECTURE.md)',
             '](PROJECT_STRUCTURE.md)':'](architecture/PROJECT_STRUCTURE.md)',
           },
           'docs/SOURCE_OF_TRUTH.md': {
             '`ARCHITECTURE.md`':'`architecture/ARCHITECTURE.md`',
             '`PROJECT_STRUCTURE.md`':'`architecture/PROJECT_STRUCTURE.md`',
           },
          }
          for f, reps in replacements.items():
              p=Path(f); text=p.read_text()
              for a,b in reps.items(): text=text.replace(a,b)
              p.write_text(text)
          PY

      - name: Verify focused documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          node --test tests/documentation-architecture-map.test.mjs tests/pr-collision-guard.test.mjs
          git diff --check
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/architecture/PROJECT_STRUCTURE.md
          test -f docs/architecture/MODULE_COVERAGE.md
          grep -q 'docs/architecture/ARCHITECTURE.md' docs/DOCUMENTATION_INVENTORY.md
          grep -q 'docs/architecture/PROJECT_STRUCTURE.md' scripts/pr-collision-guard.mjs

      - name: Commit generated migration and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-architecture-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move architecture core family to canonical owner"
          git push origin HEAD:docs/268-architecture-core-family
