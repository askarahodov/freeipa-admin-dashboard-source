name: "#632 approval owner bootstrap"

on:
  push:
    branches:
      - tmp/632-approval-owner-bootstrap

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checkpoint C product changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operations = Path("worker/operations-http-entry.ts")
          text = operations.read_text()
          old = 'import integrationRuntime, { handleCatalogRunRequest } from "./index";'
          new = 'import integrationRuntime, { handleCatalogRunRequest, loadCatalog, resolveCatalogRuntime } from "./index";'
          if text.count(old) != 1:
              raise SystemExit("operations central import mismatch")
          text = text.replace(old, new, 1)

          marker = 'import { listRunResults, readRunResultFile } from "../src/operations/run/run-results.ts";\n'
          approval_imports = '''import { catalogEventAllowed, readCatalogPolicySet } from "../src/operations/catalog/catalog-policies.ts";
          import {
            approvalRequirement,
            cancelApproval,
            claimApprovalExecution,
            decideApproval,
            finishApprovalExecution,
            listApprovals,
            readApprovalPolicySet,
          } from "../src/operations/approvals/approval-gates.ts";
          '''
          if text.count(marker) != 1:
              raise SystemExit("operations imports marker mismatch")
          text = text.replace(marker, marker + approval_imports, 1)

          type_marker = 'type ScheduledController = Parameters<NonNullable<typeof integrationRuntime.scheduled>>[0];\n'
          if text.count(type_marker) != 1:
              raise SystemExit("operations type marker mismatch")
          text = text.replace(type_marker, type_marker + 'type ApprovalAction = "approve" | "reject" | "cancel" | "execute";\n', 1)

          handler_marker = 'async function handleNotificationsList(request: Request, env: RuntimeEnv, url: URL): Promise<Response> {'
          approval_handlers = r'''async function handleApprovalsList(request: Request, env: RuntimeEnv, url: URL): Promise<Response> {
            const denied = requirePortalPermission(request, env, "directory.read");
            if (denied) return denied;
            const access = portalAccess(request, env);
            const limit = Number(url.searchParams.get("limit") ?? 100);
            try { return json(await listApprovals(env, access, Number.isFinite(limit) ? limit : 100)); }
            catch (error) { return json({ error: error instanceof Error ? error.message : "Cannot load approvals" }, 503); }
          }

          async function handleApprovalAction(
            request: Request,
            env: RuntimeEnv,
            approvalId: string,
            action: ApprovalAction,
          ): Promise<Response> {
            const denied = requirePortalPermission(
              request,
              env,
              action === "approve" || action === "reject" ? "xyops.approve" : "xyops.run",
            );
            if (denied) return denied;

            const access = portalAccess(request, env);
            const audit = createAuditContext(access);
            let body: Record<string, unknown> = {};
            try { body = await request.json() as Record<string, unknown>; } catch {}

            try {
              if (action === "approve" || action === "reject") {
                const approval = await decideApproval(env, approvalId, access, action, String(body.comment ?? ""));
                const correlationId = await auditCorrelationFor(env, { approvalId }).catch(() => null);
                const linkedAudit = withAuditCorrelation(audit, correlationId);
                await appendAuditEvent(env, linkedAudit, {
                  action: `approval.${action}`,
                  resourceType: "approval",
                  resourceId: approvalId,
                  eventId: approval.eventId,
                  schemaVersion: approval.schemaVersion,
                  approvalId,
                  runId: approval.runId,
                  outcome: "success",
                  metadata: {
                    decision: action,
                    commentProvided: Boolean(String(body.comment ?? "").trim()),
                    approvals: approval.approvals,
                    rejections: approval.rejections,
                    requiredApprovals: approval.requiredApprovals,
                    status: approval.status,
                  },
                }).catch(() => {});
                return json({ approval });
              }

              if (action === "cancel") {
                const approval = await cancelApproval(env, approvalId, access);
                const correlationId = await auditCorrelationFor(env, { approvalId }).catch(() => null);
                await appendAuditEvent(env, withAuditCorrelation(audit, correlationId), {
                  action: "approval.cancel",
                  resourceType: "approval",
                  resourceId: approvalId,
                  eventId: approval.eventId,
                  schemaVersion: approval.schemaVersion,
                  approvalId,
                  outcome: "success",
                  metadata: { status: approval.status },
                }).catch(() => {});
                return json({ approval });
              }

              const claimed = await claimApprovalExecution(env, approvalId, access);
              const approvalCorrelation = await auditCorrelationFor(env, { approvalId }).catch(() => null);
              const executionAudit = withAuditCorrelation(audit, approvalCorrelation);
              const secretValues = body.secretValues && typeof body.secretValues === "object" && !Array.isArray(body.secretValues)
                ? body.secretValues as Record<string, unknown>
                : {};
              const allowedSecretFields = new Set(claimed.spec.secretFields);
              if (Object.keys(secretValues).some((key) => !allowedSecretFields.has(key))) {
                await finishApprovalExecution(env, approvalId, "failed", "", "Переданы неожиданные секретные поля");
                return json({ error: "Переданы неожиданные секретные поля" }, 400);
              }

              const values = { ...claimed.spec.values };
              for (const key of claimed.spec.secretFields) {
                const secret = typeof secretValues[key] === "string" ? secretValues[key] as string : "";
                if (!secret) {
                  await finishApprovalExecution(env, approvalId, "failed", "", `Секретное поле ${key} не заполнено`);
                  return json({ error: `Введите секретное поле: ${key}` }, 400);
                }
                values[key] = secret;
              }

              const runtime = await resolveCatalogRuntime(env);
              const catalog = await loadCatalog(runtime.env, runtime.xyopsUrl);
              const event = catalog.events.find((item) => item.id === claimed.spec.eventId && item.enabled);
              if (!event || !event.schemaVersion || event.schemaVersion !== claimed.spec.schemaVersion) {
                await finishApprovalExecution(env, approvalId, "failed", "", "Схема процесса изменилась");
                return json({ error: "Схема процесса изменилась. Создайте новую заявку." }, 409);
              }

              const visibility = await readCatalogPolicySet(env);
              if (!catalogEventAllowed(visibility.policy, access, event)) {
                await finishApprovalExecution(env, approvalId, "failed", "", "Процесс больше недоступен инициатору");
                return json({ error: "Процесс больше недоступен по политике каталога" }, 404);
              }

              const currentPolicy = await readApprovalPolicySet(env);
              const currentRequirement = approvalRequirement(currentPolicy.policy, access, event);
              if (!currentRequirement || claimed.approval.approvals < currentRequirement.requiredApprovals) {
                await finishApprovalExecution(env, approvalId, "failed", "", "Политика согласования изменилась");
                return json({ error: "Политика согласования изменилась. Создайте новую заявку." }, 409);
              }

              const runUrl = new URL(request.url);
              runUrl.pathname = "/api/integrations/catalog/run";
              runUrl.search = "";
              const headers = new Headers(request.headers);
              headers.set("content-type", "application/json");
              headers.delete("x-portal-approved-execution");
              const launchResponse = await handleCatalogRunRequest(new Request(runUrl, {
                method: "POST",
                headers,
                body: JSON.stringify({
                  eventId: claimed.spec.eventId,
                  values,
                  targets: claimed.spec.targets,
                  replayOf: claimed.spec.parentRunId,
                }),
              }), env, runUrl, executionAudit, undefined, runtime, approvalId);

              const payload = await launchResponse.json().catch(() => ({})) as Record<string, unknown>;
              if (launchResponse.ok && typeof payload.runId === "string") {
                await finishApprovalExecution(env, approvalId, "executed", payload.runId);
                await appendAuditEvent(env, executionAudit, {
                  action: "approval.execute",
                  resourceType: "approval",
                  resourceId: approvalId,
                  eventId: claimed.spec.eventId,
                  schemaVersion: claimed.spec.schemaVersion,
                  approvalId,
                  runId: payload.runId,
                  jobId: String(payload.jobId ?? ""),
                  outcome: "success",
                  metadata: {
                    status: "executed",
                    secretFieldCount: claimed.spec.secretFields.length,
                    parentRunId: claimed.spec.parentRunId,
                  },
                }).catch(() => {});
                return json({ ...payload, approvalId, approvalExecuted: true }, launchResponse.status);
              }

              const executionOutcome = launchResponse.status >= 500 ? "unknown" : "failure";
              await finishApprovalExecution(
                env,
                approvalId,
                launchResponse.status >= 500 ? "unknown" : "failed",
                String(payload.runId ?? ""),
                String(payload.error ?? "XYOps launch failed"),
              );
              await appendAuditEvent(env, executionAudit, {
                action: "approval.execute",
                resourceType: "approval",
                resourceId: approvalId,
                eventId: claimed.spec.eventId,
                schemaVersion: claimed.spec.schemaVersion,
                approvalId,
                runId: String(payload.runId ?? ""),
                outcome: executionOutcome,
                errorCode: "xyops_launch_failed",
                metadata: { httpStatus: launchResponse.status },
              }).catch(() => {});
              return json({ ...payload, approvalId }, launchResponse.status);
            } catch (error) {
              return json({ error: error instanceof Error ? error.message : "Approval action failed" }, 409);
            }
          }

          '''
          if text.count(handler_marker) != 1:
              raise SystemExit("operations handler marker mismatch")
          text = text.replace(handler_marker, approval_handlers + handler_marker, 1)

          route_marker = '    if (request.method === "GET" && url.pathname === "/api/integrations/notifications") {\n'
          approval_routes = r'''    if (request.method === "GET" && url.pathname === "/api/integrations/approvals") {
              return handleApprovalsList(request, sourceEnv, url);
            }
            const approvalActionMatch = url.pathname.match(/^\/api\/integrations\/approvals\/([A-Za-z0-9_-]{1,160})\/(approve|reject|cancel|execute)$/);
            if (request.method === "POST" && approvalActionMatch) {
              return handleApprovalAction(
                request,
                sourceEnv,
                approvalActionMatch[1],
                approvalActionMatch[2] as ApprovalAction,
              );
            }
          '''
          if text.count(route_marker) != 1:
              raise SystemExit("operations route marker mismatch")
          text = text.replace(route_marker, approval_routes + route_marker, 1)

          old_comment = ''' * #632 operations owner. Run history/result-file delivery, per-identity run
           * notifications, and checkpoint-B cancel/rerun composition live here after the
           * established security and FreeIPA adapters. Catalog execution and approval
           * orchestration intentionally remain in the central integration runtime.
           */
          '''
          new_comment = ''' * #632 operations owner. Run history/result-file delivery, per-identity run
           * notifications, cancel/rerun, and checkpoint-C approval HTTP composition live
           * here after the established security and FreeIPA adapters. Canonical catalog
           * execution and approval-policy administration remain in the central integration
           * runtime; approval execution reuses that catalog-run handler with a server-side
           * approval identifier.
           */
          '''
          if text.count(old_comment) != 1:
              raise SystemExit("operations comment marker mismatch")
          text = text.replace(old_comment, new_comment, 1)
          operations.write_text(text)

          index = Path("worker/index.ts")
          text = index.read_text()
          old_approval_import = 'import { approvalExecutionMatches, approvalRequirement, cancelApproval, claimApprovalExecution, createApprovalRequest, decideApproval, finishApprovalExecution, listApprovals, readApprovalPolicySet, readExecutingApproval, saveApprovalPolicySet } from "../src/operations/approvals/approval-gates";'
          new_approval_import = 'import { approvalExecutionMatches, approvalRequirement, createApprovalRequest, readApprovalPolicySet, readExecutingApproval, saveApprovalPolicySet } from "../src/operations/approvals/approval-gates";'
          if text.count(old_approval_import) != 1:
              raise SystemExit("central approval import mismatch")
          text = text.replace(old_approval_import, new_approval_import, 1)
          portal_permission_import = 'import type { PortalPermission } from "../src/auth/portal-permissions";\n'
          if text.count(portal_permission_import) != 1:
              raise SystemExit("PortalPermission import mismatch")
          text = text.replace(portal_permission_import, "", 1)

          load_marker = 'async function loadCatalog(env: Env, xyopsUrl: string | null): Promise<{ mode: "demo" | "live" | "unconfigured"; events: CatalogEvent[] }> {'
          if text.count(load_marker) != 1:
              raise SystemExit("loadCatalog marker mismatch")
          text = text.replace(load_marker, 'export ' + load_marker, 1)

          effective_marker = '''async function effectiveEnv(env: Env): Promise<Env> {
            const settings = await effectiveSettings(env);
            return { ...env, DEMO_MODE: settings.config.demoMode ? "true" : "false", IPA_URL: settings.config.ipaUrl, IPA_USERNAME: settings.config.ipaUsername, IPA_PASSWORD: settings.secrets.ipaPassword, XYOPS_URL: settings.config.xyopsUrl, XYOPS_API_KEY: settings.secrets.xyopsApiKey, XYOPS_ROUTES_JSON: settings.config.routes ? JSON.stringify(settings.config.routes) : env.XYOPS_ROUTES_JSON };
          }
          '''
          resolver = effective_marker + '''
          export async function resolveCatalogRuntime(env: Env): Promise<{ env: Env; xyopsUrl: string | null }> {
            const effective = await effectiveEnv(env);
            return { env: effective, xyopsUrl: cleanBaseUrl(effective.XYOPS_URL) };
          }
          '''
          if text.count(effective_marker) != 1:
              raise SystemExit("effectiveEnv marker mismatch")
          text = text.replace(effective_marker, resolver, 1)

          approval_start = '  if (request.method === "GET" && url.pathname === "/api/integrations/approvals") {'
          next_route = '  if (request.method === "GET" && url.pathname === "/api/integrations/routes") {'
          start = text.find(approval_start)
          end = text.find(next_route, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("central approval route block markers mismatch")
          text = text[:start] + text[end:]
          index.write_text(text)

          contracts = Path("src/auth/portal-route-contract.ts")
          text = contracts.read_text()
          for route_id in [
              "xyops.approvals.list",
              "xyops.approvals.approve",
              "xyops.approvals.reject",
              "xyops.approvals.cancel",
              "xyops.approvals.execute",
          ]:
              needle = f'id: "{route_id}"'
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit(f"route contract missing {route_id}")
              line_start = text.rfind("\n", 0, pos) + 1
              line_end = text.find("\n", pos)
              line = text[line_start:line_end]
              if 'owner: "worker/index.ts"' not in line:
                  raise SystemExit(f"unexpected owner for {route_id}: {line}")
              updated = line.replace('owner: "worker/index.ts"', 'owner: "worker/operations-http-entry.ts"')
              text = text[:line_start] + updated + text[line_end:]
          contracts.write_text(text)

          owner_test = Path("tests/xyops/xyops-operations-http-owner.test.mjs")
          owner_test.write_text(r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import path from "node:path";
          import test from "node:test";
          import { fileURLToPath } from "node:url";

          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../..");
          const source = (relativePath) => readFile(path.join(repoRoot, relativePath), "utf8");

          test("#632 checkpoint C gives runs, notifications, and approval HTTP composition one post-security operations owner", async () => {
            const [freeIpaOwner, operationsOwner, central, runRuntime] = await Promise.all([
              source("worker/freeipa-http-entry.ts"),
              source("worker/operations-http-entry.ts"),
              source("worker/index.ts"),
              source("worker/xyops-run-runtime.ts"),
            ]);

            assert.match(freeIpaOwner, /import integrationRuntime from ["']\.\/operations-http-entry\.ts["']/);
            assert.match(
              operationsOwner,
              /import integrationRuntime, \{ handleCatalogRunRequest, loadCatalog, resolveCatalogRuntime \} from ["']\.\/index["']/,
            );

            for (const route of [
              "/api/integrations/runs",
              "/api/integrations/notifications",
              "/api/integrations/notifications/read",
              "/api/integrations/approvals",
            ]) assert.equal(operationsOwner.includes(route), true, `operations owner missing ${route}`);

            assert.match(operationsOwner, /runs\\\/\(\[A-Za-z0-9_-\]\{1,160\}\)\\\/\(cancel\|rerun\)/);
            assert.match(operationsOwner, /runs\\\/\(\[A-Za-z0-9_-\]\{1,160\}\)\\\/files/);
            assert.match(operationsOwner, /approvals\\\/\(\[A-Za-z0-9_-\]\{1,160\}\)\\\/\(approve\|reject\|cancel\|execute\)/);

            assert.equal(central.includes('url.pathname === "/api/integrations/notifications"'), false);
            assert.equal(central.includes('url.pathname === "/api/integrations/notifications/read"'), false);
            assert.equal(central.includes('url.pathname === "/api/integrations/runs"'), false);
            assert.equal(central.includes('url.pathname === "/api/integrations/approvals"'), false);
            assert.equal(central.includes("const approvalActionMatch"), false);
            assert.equal(central.includes("claimApprovalExecution"), false);
            assert.equal(central.includes("decideApproval"), false);
            assert.equal(central.includes("cancelApproval"), false);
            assert.equal(central.includes("finishApprovalExecution"), false);
            assert.equal(central.includes("listApprovals"), false);

            assert.equal(central.includes("readRunResultFile"), false);
            assert.equal(central.includes("const runActionMatch"), false);
            assert.equal(central.includes("readRunReplay"), false);
            assert.equal(central.includes("function runStatus"), false);
            assert.equal(central.includes("async function listOperationRuns"), false);
            assert.equal(central.includes("async function syncOperationRuns"), false);
            assert.match(central, /from ["']\.\/xyops-run-runtime\.ts["']/);
            assert.match(central, /import \{[^}]*extractJobStages[^}]*\} from ["']\.\/xyops-run-runtime\.ts["']/s);
            assert.match(central, /stages: extractJobStages\(result\)/u);

            assert.match(operationsOwner, /handleCatalogRunRequest/);
            assert.match(operationsOwner, /expectedSchemaVersion: replay\.summary\.schemaVersion/);
            assert.match(operationsOwner, /dangerousConfirmed: actionBody\.confirm === true/);
            assert.match(operationsOwner, /claimApprovalExecution/);
            assert.match(operationsOwner, /finishApprovalExecution/);
            assert.match(operationsOwner, /headers\.delete\("x-portal-approved-execution"\)/u);
            assert.match(operationsOwner, /resolveCatalogRuntime/);
            assert.match(operationsOwner, /loadCatalog\(runtime\.env, runtime\.xyopsUrl\)/u);
            assert.match(operationsOwner, /currentRequirement\.requiredApprovals/u);
            assert.match(operationsOwner, /handleCatalogRunRequest\([\s\S]*runtime, approvalId\)/u);
            assert.match(central, /export async function handleCatalogRunRequest/);
            assert.match(central, /export async function loadCatalog/);
            assert.match(central, /export async function resolveCatalogRuntime/);

            assert.match(runRuntime, /export function runStatus/);
            assert.match(runRuntime, /export async function listOperationRuns/);
            assert.match(runRuntime, /export async function syncOperationRuns/);
            assert.match(runRuntime, /saveOperationRun/);
            assert.match(runRuntime, /saveRunResult/);
            assert.match(runRuntime, /xyops\.run\.status_changed/);
          });

          test("canonical route metadata moves approval HTTP ownership without moving catalog execution or approval-policy administration", async () => {
            const contracts = await source("src/auth/portal-route-contract.ts");
            const line = (id) => contracts.split("\n").find((candidate) => candidate.includes(`id: "${id}"`)) ?? "";

            for (const id of [
              "xyops.runs.list",
              "xyops.runs.file",
              "xyops.runs.cancel",
              "xyops.runs.rerun",
              "xyops.notifications.list",
              "xyops.notifications.read",
              "xyops.approvals.list",
              "xyops.approvals.approve",
              "xyops.approvals.reject",
              "xyops.approvals.cancel",
              "xyops.approvals.execute",
            ]) {
              assert.match(line(id), /owner: "worker\/operations-http-entry\.ts"/u, `stale owner for ${id}`);
            }

            for (const id of [
              "xyops.catalog.run",
              "xyops.approval-policies.read",
              "xyops.approval-policies.update",
            ]) {
              assert.match(line(id), /owner: "worker\/index\.ts"/u, `${id} moved outside checkpoint C`);
            }
          });

          test("operations owner preserves permission, approval, and file-proxy safety boundaries", async () => {
            const adapter = await source("worker/operations-http-entry.ts");
            assert.match(adapter, /requirePortalPermission\(request, env, "directory\.read"\)/u);
            assert.match(adapter, /"xyops\.approve" : "xyops\.run"/u);
            assert.match(adapter, /allowedSecretFields/u);
            assert.match(adapter, /event\.schemaVersion !== claimed\.spec\.schemaVersion/u);
            assert.match(adapter, /catalogEventAllowed/u);
            assert.match(adapter, /approvalRequirement/u);
            assert.match(adapter, /fileUrl\.origin !== xyopsOrigin\.origin/u);
            assert.match(adapter, /redirect: "manual"/u);
            assert.match(adapter, /XYOPS_RESULT_FILE_MAX_BYTES/u);
            assert.match(adapter, /536_870_912/u);
            assert.match(adapter, /x-content-type-options/u);
            assert.match(adapter, /effectiveXyOpsRuntime/u);
          });
          ''')

          readme = Path("worker/README.md")
          text = readme.read_text()
          old = '#632 checkpoints A-B insert `operations-http-entry.ts` after the FreeIPA adapter for run-history/result-file reads, cancel/rerun composition, and per-identity notifications; `xyops-run-runtime.ts` holds the shared run synchronization/projection helpers. Rerun reuses the canonical catalog-run handler in `worker/index.ts`, so catalog execution/approvals and the remaining XYOps/settings/integration behavior stay central until later slices.'
          new = '#632 checkpoints A-C insert `operations-http-entry.ts` after the FreeIPA adapter for run-history/result-file reads, cancel/rerun composition, per-identity notifications, and approval list/decision/cancel/execute HTTP composition; `xyops-run-runtime.ts` holds the shared run synchronization/projection helpers. Rerun and approval execution reuse the canonical catalog-run handler in `worker/index.ts`, and approval execution passes the claimed approval identifier only in memory, so catalog execution, approval-policy administration and the remaining XYOps/settings/integration behavior stay central until later slices.'
          if text.count(old) != 1:
              raise SystemExit("worker README checkpoint text mismatch")
          readme.write_text(text.replace(old, new, 1))

          composition = Path("docs/architecture/WORKER_COMPOSITION.md")
          text = composition.read_text()
          replacements = {
              '#632 checkpoints A-B let that post-security operations adapter own run-history/result-file reads, cancel/rerun composition, and per-identity notifications before unmatched traffic continues to `worker/index.ts`; neither adapter is a second authentication boundary.':
              '#632 checkpoints A-C let that post-security operations adapter own run-history/result-file reads, cancel/rerun composition, per-identity notifications, and approval list/decision/cancel/execute HTTP composition before unmatched traffic continues to `worker/index.ts`; neither adapter is a second authentication boundary. Approval execution reuses the central catalog runtime and catalog-run handler with the claimed approval identifier passed only in memory.',
              'Checkpoints #632A-B move `xyops.runs.list`, `xyops.runs.file`, `xyops.runs.cancel`, `xyops.runs.rerun`, `xyops.notifications.list` and `xyops.notifications.read` into `worker/operations-http-entry.ts`. Shared run status/synchronization/projection logic lives in `worker/xyops-run-runtime.ts`; rerun calls the canonical catalog-run handler so catalog execution and approvals remain in `worker/index.ts` for later bounded #632 slices. XYOps remains authoritative for process definitions and execution/scheduler/queue semantics.':
              'Checkpoints #632A-C move `xyops.runs.list`, `xyops.runs.file`, `xyops.runs.cancel`, `xyops.runs.rerun`, `xyops.notifications.list`, `xyops.notifications.read` and the approval list/approve/reject/cancel/execute routes into `worker/operations-http-entry.ts`. Shared run status/synchronization/projection logic lives in `worker/xyops-run-runtime.ts`; rerun and approval execution call the canonical catalog-run handler, while catalog execution and approval-policy administration remain in `worker/index.ts` for later bounded #632 slices. XYOps remains authoritative for process definitions and execution/scheduler/queue semantics.',
              '`operations-http-entry.ts` owns run reads/result-file proxy/cancel/rerun/notifications; catalog execution and approvals stay in `worker/index.ts`':
              '`operations-http-entry.ts` owns run reads/result-file proxy/cancel/rerun/notifications and approval HTTP composition; catalog execution and approval-policy administration stay in `worker/index.ts`',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"composition text mismatch: {old[:80]}")
              text = text.replace(old, new, 1)
          composition.write_text(text)
          PY

          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Focused approval and owner tests
        run: |
          node --experimental-strip-types --test \
            tests/xyops/xyops-approvals.test.mjs \
            tests/xyops/xyops-approval-trust-boundary.test.mjs \
            tests/xyops/xyops-operations-http-owner.test.mjs \
            tests/xyops/xyops-effective-settings.test.mjs \
            tests/auth/portal-application-router.test.mjs \
            tests/auth/portal-route-security-plan.test.mjs

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Publish clean product branch
        shell: bash
        env:
          BASE_SHA: 9317e5fed13240c806a51e67aa73727d512b24e5
          PRODUCT_BRANCH: arch/632-approval-http-owner
        run: |
          git diff -- \
