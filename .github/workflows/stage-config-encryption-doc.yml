name: Stage config encryption documentation

on:
  push:
    branches:
      - docs/268-config-encryption-security-1d9a

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit and relocate encryption-key documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo '=== inbound refs before relocation ==='
          git grep -n 'CONFIG_ENCRYPTION_KEY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-config-encryption-doc.yml' || true
          git grep -l 'CONFIG_ENCRYPTION_KEY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-config-encryption-doc.yml' > /tmp/config-key-refs.txt || true
          cat /tmp/config-key-refs.txt

          cp docs/CONFIG_ENCRYPTION_KEY.md docs/security/CONFIG_ENCRYPTION_KEY.md
          cat > docs/CONFIG_ENCRYPTION_KEY.md <<'EOF'
          # Relocated

          The canonical encryption-key security contract has moved to [`security/CONFIG_ENCRYPTION_KEY.md`](security/CONFIG_ENCRYPTION_KEY.md). This compatibility pointer is retained for existing external links; do not update encryption-key policy here.
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path(line.strip()) for line in Path('/tmp/config-key-refs.txt').read_text().splitlines() if line.strip()]
          for p in files:
              if p == Path('docs/CONFIG_ENCRYPTION_KEY.md'):
                  continue
              text = p.read_text()
              old = text
              text = text.replace('docs/CONFIG_ENCRYPTION_KEY.md', 'docs/security/CONFIG_ENCRYPTION_KEY.md')
              if p.parent == Path('docs'):
                  text = text.replace('](CONFIG_ENCRYPTION_KEY.md)', '](security/CONFIG_ENCRYPTION_KEY.md)')
              elif p.parent == Path('docs/security'):
                  text = text.replace('](../CONFIG_ENCRYPTION_KEY.md)', '](CONFIG_ENCRYPTION_KEY.md)')
              elif str(p).startswith('docs/'):
                  text = text.replace('](../CONFIG_ENCRYPTION_KEY.md)', '](../security/CONFIG_ENCRYPTION_KEY.md)')
                  text = text.replace('](../../docs/CONFIG_ENCRYPTION_KEY.md)', '](../../docs/security/CONFIG_ENCRYPTION_KEY.md)')
              if text != old:
                  p.write_text(text)

          sec = Path('docs/security/README.md')
          s = sec.read_text()
          if '- [`CONFIG_ENCRYPTION_KEY.md`](CONFIG_ENCRYPTION_KEY.md)' not in s:
              marker = '- [`DEPENDENCY_SECURITY.md`](DEPENDENCY_SECURITY.md) — production dependency audit, SBOM, runtime image scanning, temporary exceptions and upgrade/rollback policy.\n'
              entry = '- [`CONFIG_ENCRYPTION_KEY.md`](CONFIG_ENCRYPTION_KEY.md) — production encryption-key requirements and protected settings encryption boundary.\n'
              if marker not in s:
                  raise SystemExit('security README insertion marker missing')
              s = s.replace(marker, marker + entry)
              sec.write_text(s)

          stale = []
          pattern = re.compile(r'\]\((?:\.\./)?CONFIG_ENCRYPTION_KEY\.md\)')
          for p in Path('docs').rglob('*.md'):
              if p == Path('docs/CONFIG_ENCRYPTION_KEY.md') or str(p).startswith('docs/superpowers/') or p.parent == Path('docs/security'):
                  continue
              for lineno, line in enumerate(p.read_text().splitlines(), 1):
                  if pattern.search(line):
                      stale.append(f'{p}:{lineno}:{line}')
          if stale:
              raise SystemExit('stale CONFIG_ENCRYPTION_KEY markdown links outside security owner:\n' + '\n'.join(stale))
          PY

          echo '=== refs after relocation ==='
          git grep -n 'CONFIG_ENCRYPTION_KEY\.md' -- ':!docs/superpowers/**' ':!.github/workflows/stage-config-encryption-doc.yml' || true

          test -f docs/security/CONFIG_ENCRYPTION_KEY.md
          grep -Fq '# Relocated' docs/CONFIG_ENCRYPTION_KEY.md
          grep -Fq 'security/CONFIG_ENCRYPTION_KEY.md' docs/CONFIG_ENCRYPTION_KEY.md
          grep -Fq 'CONFIG_ENCRYPTION_KEY.md' docs/security/README.md

          npm ci --ignore-scripts
          npm run docs:check

          mapfile -t tests < <(git grep -l 'CONFIG_ENCRYPTION_KEY\.md' -- 'tests/*.test.mjs' || true)
          if ((${#tests[@]})); then
            printf 'focused tests: %s\n' "${tests[*]}"
            node --test "${tests[@]}"
          fi

          rm .github/workflows/stage-config-encryption-doc.yml
          git add -A
          git diff --cached --check
          git commit -m 'docs: move encryption key contract to security owner'
          git push origin HEAD:docs/268-config-encryption-security-1d9a
