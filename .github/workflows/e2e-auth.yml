name: Scoped E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: scoped-e2e-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoped-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate test routing policy
        run: node --test tests/auth-e2e-routing.test.mjs tests/test-scope-routing.test.mjs

      - name: Determine affected test categories
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            : > "$RUNNER_TEMP/e2e-changed-files.txt"
            node scripts/auth-e2e-scope.mjs --github-output "$GITHUB_OUTPUT" --full "$RUNNER_TEMP/e2e-changed-files.txt"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/e2e-changed-files.txt"
          node scripts/auth-e2e-scope.mjs --github-output "$GITHUB_OUTPUT" "$RUNNER_TEMP/e2e-changed-files.txt"

      - name: Report selected coverage
        run: |
          echo "categories=${{ steps.scope.outputs.categories }}"
          echo "browser_specs=${{ steps.scope.outputs.browser_specs }}"
          echo "contract_tests=${{ steps.scope.outputs.contract_tests }}"

      - name: No browser E2E required for this pull request
        if: steps.scope.outputs.browser_specs == ''
        run: echo "No browser E2E category is affected by this change."

      - name: Run affected contract tests
        if: steps.scope.outputs.contract_tests != ''
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tests <<< "${{ steps.scope.outputs.contract_tests }}"
          node --experimental-strip-types --test "${tests[@]}"

      - name: Prepare isolated E2E environment
        if: steps.scope.outputs.browser_specs != ''
        run: cp .env.e2e.example .env.e2e

      - name: Run affected Chromium scenarios
        if: steps.scope.outputs.browser_specs != ''
        env:
          CI: "true"
          E2E_SPECS: ${{ steps.scope.outputs.browser_specs }}
        run: npm run test:e2e:auth

      - name: Upload Playwright artifacts
        if: steps.scope.outputs.browser_specs != '' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-e2e-report
          path: |
            artifacts/e2e/playwright-report
            artifacts/e2e/test-results
            artifacts/e2e/compose.log
          if-no-files-found: warn
          retention-days: 14
