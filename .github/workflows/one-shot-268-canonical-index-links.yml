name: One-shot canonical documentation index links

on:
  push:
    branches:
      - docs/268-canonical-index-links-cd63

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Canonicalize central documentation links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/README.md')
          s = p.read_text()
          replacements = {
            '](MAINTENANCE_MODE.md)': '](operations/MAINTENANCE_MODE.md)',
            '](OFFLINE_FULL_RESTORE.md)': '](operations/OFFLINE_FULL_RESTORE.md)',
            '](LOCAL_AUTH_RBAC.md)': '](security/LOCAL_AUTH_RBAC.md)',
            '](LOCAL_ACCEPTANCE_TESTS.md)': '](operations/LOCAL_ACCEPTANCE_TESTS.md)',
            '](P0_OPERATIONAL_ACCEPTANCE.md)': '](operations/P0_OPERATIONAL_ACCEPTANCE.md)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cat > tests/documentation-canonical-index-links.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          test('central documentation index links directly to canonical moved owners', async () => {
            const index = await readFile(new URL('../docs/README.md', import.meta.url), 'utf8');
            const canonicalLinks = [
              '](operations/MAINTENANCE_MODE.md)',
              '](operations/OFFLINE_FULL_RESTORE.md)',
              '](security/LOCAL_AUTH_RBAC.md)',
              '](operations/LOCAL_ACCEPTANCE_TESTS.md)',
              '](operations/P0_OPERATIONAL_ACCEPTANCE.md)',
            ];
            for (const link of canonicalLinks) assert.ok(index.includes(link), `missing canonical link ${link}`);

            const compatibilityLinks = [
              '](MAINTENANCE_MODE.md)',
              '](OFFLINE_FULL_RESTORE.md)',
              '](LOCAL_AUTH_RBAC.md)',
              '](LOCAL_ACCEPTANCE_TESTS.md)',
              '](P0_OPERATIONAL_ACCEPTANCE.md)',
            ];
            for (const link of compatibilityLinks) assert.ok(!index.includes(link), `central index must not route through compatibility pointer ${link}`);
          });
          EOF
      - name: Validate navigation batch
        run: |
          npm run docs:check
          node --test tests/documentation-canonical-index-links.test.mjs
          git diff --check
      - name: Commit final self-cleaned batch
        run: |
          rm .github/workflows/one-shot-268-canonical-index-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/README.md tests/documentation-canonical-index-links.test.mjs .github/workflows/one-shot-268-canonical-index-links.yml
          git commit -m 'docs: canonicalize central documentation navigation'
          git push
