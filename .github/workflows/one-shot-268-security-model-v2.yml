name: One-shot #268 security model v2

on:
  push:
    branches:
      - docs/268-security-model-family-v2

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Reapply security model family on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin docs/268-security-model-family
          git checkout origin/docs/268-security-model-family -- \
            docs/DOCUMENTATION_INVENTORY.md \
            docs/README.md \
            docs/SECURITY_MODEL.md \
            docs/security/README.md \
            docs/security/SECURITY_MODEL.md \
            tests/documentation-security-model.test.mjs

          python <<'PY'
          from pathlib import Path
          p = Path('docs/ai/README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('](../SECURITY_MODEL.md)', '](../security/SECURITY_MODEL.md)')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate security model family
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          node --experimental-strip-types --test tests/documentation-security-model.test.mjs
          git diff --check
          test -s docs/security/SECURITY_MODEL.md
          grep -q 'security/SECURITY_MODEL.md' docs/SECURITY_MODEL.md
          grep -q 'security/SECURITY_MODEL.md' docs/ai/README.md
          grep -q 'AI_AGENT_WORKFLOW.md' docs/ai/README.md
      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-security-model-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'docs: move security model to canonical owner'
          git push origin HEAD:docs/268-security-model-family-v2
