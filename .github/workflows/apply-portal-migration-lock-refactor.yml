name: Apply portal migration lock refactor

on:
  push:
    branches:
      - agent/storage-migration-preflight-readonly
    paths:
      - .github/workflows/apply-portal-migration-lock-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/storage-migration-preflight-readonly
          fetch-depth: 0

      - name: Apply exact source transformation
        run: node scripts/apply-portal-migration-lock-refactor.mjs

      - name: Verify and commit transformation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- db/portal-migrations.ts
          git rm scripts/apply-portal-migration-lock-refactor.mjs
          git rm .github/workflows/apply-portal-migration-lock-refactor.yml
          git add db/portal-migrations.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: adopt shared portal migration lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
