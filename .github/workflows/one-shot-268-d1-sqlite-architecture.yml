name: One-shot stage D1 SQLite architecture doc

on:
  push:
    branches:
      - docs/268-d1-sqlite-architecture

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Move D1 SQLite architecture contract
        shell: bash
        run: |
          set -euo pipefail
          cp docs/D1_SQLITE_ADAPTER.md docs/architecture/D1_SQLITE_ADAPTER.md
          cat > docs/D1_SQLITE_ADAPTER.md <<'EOF'
          # Relocated

          Canonical document: [`architecture/D1_SQLITE_ADAPTER.md`](architecture/D1_SQLITE_ADAPTER.md).
          EOF
          python <<'PY'
          from pathlib import Path
          suffixes={'.md','.mjs','.js','.ts','.tsx','.yml','.yaml','.json'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              s=p.as_posix()
              if s.startswith(('docs/superpowers/','.git/','node_modules/','.github/workflows/one-shot-268-d1-sqlite-architecture.yml')):
                  continue
              text=p.read_text(encoding='utf-8')
              old=text
              text=text.replace('docs/D1_SQLITE_ADAPTER.md', 'docs/architecture/D1_SQLITE_ADAPTER.md')
              if s.startswith('docs/') and not s.startswith('docs/architecture/'):
                  text=text.replace('](D1_SQLITE_ADAPTER.md)', '](architecture/D1_SQLITE_ADAPTER.md)')
              if s.startswith('docs/ai/'):
                  text=text.replace('](../D1_SQLITE_ADAPTER.md)', '](../architecture/D1_SQLITE_ADAPTER.md)')
              if text != old:
                  p.write_text(text,encoding='utf-8')
          PY
          grep -q 'D1_SQLITE_ADAPTER.md' docs/architecture/README.md || cat >> docs/architecture/README.md <<'EOF'
          - [`D1_SQLITE_ADAPTER.md`](D1_SQLITE_ADAPTER.md) — local D1-compatible SQLite runtime adapter boundary and persistence contract.
          EOF
      - name: Validate D1 SQLite architecture contract
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          node --test tests/documentation-architecture-map.test.mjs
          git diff --check
          test -s docs/architecture/D1_SQLITE_ADAPTER.md
          grep -q '^# Relocated' docs/D1_SQLITE_ADAPTER.md
          if git grep -n 'docs/D1_SQLITE_ADAPTER.md' -- ':!docs/D1_SQLITE_ADAPTER.md' ':!docs/superpowers/**' ':!.github/workflows/one-shot-268-d1-sqlite-architecture.yml'; then
            echo 'stale active root-path references remain'
            exit 1
          fi
      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-d1-sqlite-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'docs: move D1 SQLite adapter contract to architecture owner'
          git push origin HEAD:docs/268-d1-sqlite-architecture
