name: Refresh sharp lock

on:
  push:
    branches:
      - security/sharp-0.35.4

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sharp-0.35.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-sharp-lock.yml
          git add package-lock.json .github/workflows/refresh-sharp-lock.yml
          git commit -m "security: refresh sharp lockfile"
          git push origin HEAD:security/sharp-0.35.4
