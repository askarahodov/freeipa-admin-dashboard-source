name: "#632 approval owner bootstrap"

on:
  push:
    branches:
      - tmp/632-approval-owner-bootstrap

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed checkpoint C transformation
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          source = subprocess.check_output([
              "git", "show",
              "5ae20a48aba3300749869bd3edef035574f14cd3:.github/workflows/632-approval-owner-bootstrap.yml",
          ], text=True)
          lines = source.splitlines()
          start = lines.index("          from pathlib import Path")
          end = lines.index("          PY", start)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines[start:end])
          exec(compile(script, "#632-checkpoint-c-transform.py", "exec"), {})
          PY
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Focused approval and owner tests
        run: |
          node --experimental-strip-types --test \
            tests/xyops/xyops-approvals.test.mjs \
            tests/xyops/xyops-approval-trust-boundary.test.mjs \
            tests/xyops/xyops-operations-http-owner.test.mjs \
            tests/xyops/xyops-effective-settings.test.mjs \
            tests/auth/portal-application-router.test.mjs \
            tests/auth/portal-route-security-plan.test.mjs

      - name: Publish clean product branch
        shell: bash
        env:
          BASE_SHA: 9317e5fed13240c806a51e67aa73727d512b24e5
          PRODUCT_BRANCH: arch/632-approval-http-owner
        run: |
          git diff -- \
            worker/index.ts \
            worker/operations-http-entry.ts \
            src/auth/portal-route-contract.ts \
            tests/xyops/xyops-operations-http-owner.test.mjs \
            worker/README.md \
            docs/architecture/WORKER_COMPOSITION.md > /tmp/632c.patch

          git reset --hard "$BASE_SHA"
          git clean -fd
          git checkout -B "$PRODUCT_BRANCH" "$BASE_SHA"
          git apply /tmp/632c.patch
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker/index.ts \
            worker/operations-http-entry.ts \
            src/auth/portal-route-contract.ts \
            tests/xyops/xyops-operations-http-owner.test.mjs \
            worker/README.md \
            docs/architecture/WORKER_COMPOSITION.md
          git commit -m "refactor(worker): move approval HTTP routes to operations owner"
          git push --force-with-lease origin "$PRODUCT_BRANCH"
