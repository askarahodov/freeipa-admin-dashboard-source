name: One-shot restore approval gates owner

on:
  push:
    branches:
      - fix/approval-gates-document-owner

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Restore product approval-gates owner
        shell: bash
        run: |
          set -euo pipefail
          cp docs/ai/APPROVAL_GATES.md docs/APPROVAL_GATES.md
          rm docs/ai/APPROVAL_GATES.md
          python <<'PY'
          from pathlib import Path
          root = Path('.')
          suffixes = {'.md', '.mjs', '.js', '.ts', '.tsx', '.yml', '.yaml', '.json'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              s = p.as_posix()
              if s.startswith(('docs/superpowers/', '.git/', 'node_modules/', '.github/workflows/one-shot-fix-approval-gates-owner.yml')):
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              text = text.replace('docs/ai/APPROVAL_GATES.md', 'docs/APPROVAL_GATES.md')
              text = text.replace('](ai/APPROVAL_GATES.md)', '](APPROVAL_GATES.md)')
              text = text.replace('](APPROVAL_GATES.md)', '](../APPROVAL_GATES.md)') if s.startswith('docs/ai/') else text
              text = text.replace('- [`APPROVAL_GATES.md`](APPROVAL_GATES.md) — approval boundaries and execution gates for automated/agent work.\n', '')
              if text != original:
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Validate approval-gates owner correction
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          mapfile -t tests < <(grep -rl 'APPROVAL_GATES' tests --include='*.test.mjs' --include='*.test.js' | sort -u || true)
          if (( ${#tests[@]} )); then
            node --experimental-strip-types --test --test-concurrency=1 "${tests[@]}"
          fi
          git diff --check
          test -s docs/APPROVAL_GATES.md
          test ! -e docs/ai/APPROVAL_GATES.md
          grep -q 'Approval-гейты опасных процессов XYOps' docs/APPROVAL_GATES.md
          grep -q 'AI_AGENT_WORKFLOW.md' docs/ai/README.md
      - name: Commit final self-cleaned correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-approval-gates-owner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'fix(docs): restore approval gates product owner'
          git push origin HEAD:fix/approval-gates-document-owner
