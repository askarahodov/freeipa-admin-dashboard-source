services:
  dashboard:
    build:
      context: .
    image: freeipa-admin-dashboard:local
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY to a unique 32-byte key}
    volumes:
      - dashboard-data:/data
    networks:
      - portal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  recovery:
    profiles: ["recovery"]
    build:
      context: .
      target: recovery
    image: freeipa-admin-dashboard-recovery:local
    user: "${PORTAL_RECOVERY_UID:-10001}:${PORTAL_RECOVERY_GID:-10001}"
    working_dir: /app
    volumes:
      - dashboard-data:/portal-data
      - ${PORTAL_RECOVERY_DIR:-./recovery}:/recovery
      - ${PORTAL_RECOVERY_SECRETS_DIR:-./recovery-secrets}:/run/portal-recovery-secrets:ro
    networks:
      - portal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  portal:
    driver: bridge

volumes:
  dashboard-data:
