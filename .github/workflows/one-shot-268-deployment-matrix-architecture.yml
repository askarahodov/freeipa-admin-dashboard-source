name: One-shot stage deployment matrix architecture doc

on:
  push:
    branches:
      - docs/268-deployment-matrix-architecture

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Move deployment matrix architecture contract
        shell: bash
        run: |
          set -euo pipefail
          cp docs/DEPLOYMENT_MATRIX.md docs/architecture/DEPLOYMENT_MATRIX.md
          cat > docs/DEPLOYMENT_MATRIX.md <<'EOF'
          # Relocated

          The canonical deployment support matrix has moved to [`architecture/DEPLOYMENT_MATRIX.md`](architecture/DEPLOYMENT_MATRIX.md). This compatibility pointer is retained for existing external links; do not update deployment policy here.
          EOF
          python <<'PY'
          from pathlib import Path
          suffixes={'.md','.mjs','.js','.ts','.tsx','.yml','.yaml','.json'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              s=p.as_posix()
              if s.startswith(('docs/superpowers/','.git/','node_modules/','.github/workflows/one-shot-268-deployment-matrix-architecture.yml')):
                  continue
              text=p.read_text(encoding='utf-8')
              old=text
              text=text.replace('docs/DEPLOYMENT_MATRIX.md', 'docs/architecture/DEPLOYMENT_MATRIX.md')
              if s.startswith('docs/') and not s.startswith('docs/architecture/'):
                  text=text.replace('](DEPLOYMENT_MATRIX.md)', '](architecture/DEPLOYMENT_MATRIX.md)')
              if s.startswith('docs/ai/'):
                  text=text.replace('](../DEPLOYMENT_MATRIX.md)', '](../architecture/DEPLOYMENT_MATRIX.md)')
              if text != old:
                  p.write_text(text,encoding='utf-8')
          PY
          python <<'PY'
          from pathlib import Path
          p=Path('docs/architecture/README.md')
          t=p.read_text(encoding='utf-8')
          old='- [`../DEPLOYMENT_MATRIX.md`](../DEPLOYMENT_MATRIX.md) — supported and unsupported deployment models.'
          new='- [`DEPLOYMENT_MATRIX.md`](DEPLOYMENT_MATRIX.md) — supported and unsupported deployment models and current production invariants.'
          if old in t:
              t=t.replace(old,new,1)
          elif '](DEPLOYMENT_MATRIX.md)' not in t:
              t += '\n' + new + '\n'
          p.write_text(t,encoding='utf-8')
          PY
          cat > tests/documentation-deployment-matrix.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          function text(path) {
            return readFileSync(new URL(`../${path}`, import.meta.url), "utf8");
          }

          test("deployment matrix has one canonical architecture owner", () => {
            const canonical = text("docs/architecture/DEPLOYMENT_MATRIX.md");
            const pointer = text("docs/DEPLOYMENT_MATRIX.md");
            assert.match(canonical, /^# Deployment support matrix/m);
            assert.match(canonical, /Supported production/);
            assert.match(canonical, /Kubernetes \/ Helm deployment/);
            assert.match(canonical, /PORTAL_DATA_DIR/);
            assert.match(pointer, /^# Relocated/m);
            assert.match(pointer, /architecture\/DEPLOYMENT_MATRIX\.md/);
            assert.match(pointer, /compatibility pointer/);
          });

          test("deployment matrix is exposed by architecture navigation", () => {
            const architecture = text("docs/architecture/README.md");
            const index = text("docs/README.md");
            const inventory = text("docs/DOCUMENTATION_INVENTORY.md");
            assert.match(architecture, /\[`DEPLOYMENT_MATRIX\.md`\]\(DEPLOYMENT_MATRIX\.md\)/);
            assert.match(index, /\[`DEPLOYMENT_MATRIX\.md`\]\(architecture\/DEPLOYMENT_MATRIX\.md\)/);
            assert.match(inventory, /`docs\/architecture\/DEPLOYMENT_MATRIX\.md`[^\n]+`verified-active`/);
          });
          EOF
      - name: Validate deployment matrix architecture contract
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          node --test tests/documentation-architecture-map.test.mjs tests/documentation-deployment-matrix.test.mjs
          git diff --check
          test -s docs/architecture/DEPLOYMENT_MATRIX.md
          grep -q '^# Relocated' docs/DEPLOYMENT_MATRIX.md
          if git grep -n 'docs/DEPLOYMENT_MATRIX.md' -- ':!docs/DEPLOYMENT_MATRIX.md' ':!docs/superpowers/**' ':!.github/workflows/one-shot-268-deployment-matrix-architecture.yml'; then
            echo 'stale active root-path references remain'
            exit 1
          fi
      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-deployment-matrix-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'docs: move deployment matrix to architecture owner'
          git push origin HEAD:docs/268-deployment-matrix-architecture
