name: One-shot stage XYOps integrations documentation family

on:
  push:
    branches:
      - docs/268-xyops-integrations-family

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Move XYOps integrations documentation family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/integrations
          files=(CATALOG_POLICIES.md CATALOG_SYNC.md XYOPS_EXECUTION_OWNERSHIP.md XYOPS_INSPECTOR.md PROCESS_PRESENTATION_METADATA.md)
          for f in "${files[@]}"; do
            cp "docs/$f" "docs/integrations/$f"
            cat > "docs/$f" <<EOF
          # Relocated

          Canonical document: [\`integrations/$f\`](integrations/$f).
          EOF
          done
          cat > docs/integrations/README.md <<'EOF'
          # Integrations documentation

          Canonical product/runtime contracts for external integrations.

          ## XYOps

          - [`CATALOG_POLICIES.md`](CATALOG_POLICIES.md) — catalog visibility policies and server-side enforcement.
          - [`CATALOG_SYNC.md`](CATALOG_SYNC.md) — scheduled/manual catalog synchronization and locking.
          - [`XYOPS_EXECUTION_OWNERSHIP.md`](XYOPS_EXECUTION_OWNERSHIP.md) — portal/XYOps execution ownership boundary.
          - [`XYOPS_INSPECTOR.md`](XYOPS_INSPECTOR.md) — safe read-only installed-version inspection.
          - [`PROCESS_PRESENTATION_METADATA.md`](PROCESS_PRESENTATION_METADATA.md) — process presentation metadata contract.
          EOF
          python <<'PY'
          from pathlib import Path
          names = [
              'CATALOG_POLICIES.md', 'CATALOG_SYNC.md', 'XYOPS_EXECUTION_OWNERSHIP.md',
              'XYOPS_INSPECTOR.md', 'PROCESS_PRESENTATION_METADATA.md'
          ]
          suffixes={'.md','.mjs','.js','.ts','.tsx','.yml','.yaml','.json'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              s=p.as_posix()
              if s.startswith(('docs/superpowers/','.git/','node_modules/','.github/workflows/one-shot-268-xyops-integrations.yml')):
                  continue
              text=p.read_text(encoding='utf-8')
              old=text
              for name in names:
                  text=text.replace(f'docs/{name}', f'docs/integrations/{name}')
                  if s.startswith('docs/') and not s.startswith('docs/integrations/'):
                      text=text.replace(f']({name})', f'](integrations/{name})')
                  if s.startswith('docs/ai/'):
                      text=text.replace(f'](../{name})', f'](../integrations/{name})')
              if text != old:
                  p.write_text(text, encoding='utf-8')
          PY
          # Rebase root-relative docs links inside moved documents when present.
          python <<'PY'
          from pathlib import Path
          for p in Path('docs/integrations').glob('*.md'):
              if p.name == 'README.md':
                  continue
              text=p.read_text(encoding='utf-8')
              for name in ['SOURCE_OF_TRUTH.md','SECURITY_MODEL.md','CONFIG_ENCRYPTION_KEY.md','APPROVAL_GATES.md','DEPLOYMENT_MATRIX.md']:
                  text=text.replace(f']({name})', f'](../{name})')
              text=text.replace('](security/SECURITY_MODEL.md)', '](../security/SECURITY_MODEL.md)')
              text=text.replace('](reference/API.md)', '](../reference/API.md)')
              text=text.replace('](reference/PERMISSIONS.md)', '](../reference/PERMISSIONS.md)')
              text=text.replace('](reference/CONFIGURATION.md)', '](../reference/CONFIGURATION.md)')
              p.write_text(text, encoding='utf-8')
          PY
          grep -q 'integrations/README.md' docs/README.md || python <<'PY'
          from pathlib import Path
          p=Path('docs/README.md')
          t=p.read_text(encoding='utf-8')
          marker='| [`ai/README.md`](ai/README.md) | Mandatory AI-agent entrypoint |\n'
          insert=marker+'| [`integrations/README.md`](integrations/README.md) | Canonical external integration product/runtime contracts |\n'
          if marker in t:
              t=t.replace(marker,insert,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate XYOps integrations documentation family
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          mapfile -t tests < <(grep -rlE 'CATALOG_POLICIES|CATALOG_SYNC|XYOPS_EXECUTION_OWNERSHIP|XYOPS_INSPECTOR|PROCESS_PRESENTATION_METADATA' tests --include='*.test.mjs' --include='*.test.js' | sort -u || true)
          if (( ${#tests[@]} )); then
            node --experimental-strip-types --test --test-concurrency=1 "${tests[@]}"
          fi
          git diff --check
          for f in CATALOG_POLICIES.md CATALOG_SYNC.md XYOPS_EXECUTION_OWNERSHIP.md XYOPS_INSPECTOR.md PROCESS_PRESENTATION_METADATA.md; do
            test -s "docs/integrations/$f"
            grep -q '^# Relocated' "docs/$f"
          done
      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-xyops-integrations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'docs: move XYOps integration family to canonical owner'
          git push origin HEAD:docs/268-xyops-integrations-family
