name: Narrow PR 448 AI policy ownership

on:
  push:
    branches:
      - docs/268-ai-policy-owner

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep product approval contract out of docs/ai
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git show origin/main:docs/APPROVAL_GATES.md > docs/APPROVAL_GATES.md
          rm -f docs/ai/APPROVAL_GATES.md

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ai/README.md')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if 'APPROVAL_GATES.md' not in line]
          p.write_text('\n'.join(lines) + '\n')
          PY

          rm .github/workflows/narrow-ai-policy-448.yml
          test -f docs/APPROVAL_GATES.md
          test ! -e docs/ai/APPROVAL_GATES.md
          ! grep -Fq 'APPROVAL_GATES.md' docs/ai/README.md
          git add -A
          git diff --cached --check
          git commit -m 'docs: keep approval gates with product contracts'
          git push origin HEAD:docs/268-ai-policy-owner
