name: Fix security model contract paths

on:
  push:
    branches:
      - docs/268-security-model-family

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical security documentation consumers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          from pathlib import Path

          ai = Path('docs/ai/README.md')
          text = ai.read_text().replace('(../SECURITY_MODEL.md)', '(../security/SECURITY_MODEL.md)')
          ai.write_text(text)

          test_file = Path('tests/documentation-security-model.test.mjs')
          text = test_file.read_text()
          text = text.replace('text("docs/SECURITY_MODEL.md")', 'text("docs/security/SECURITY_MODEL.md")')
          text = text.replace(r'/\[`SECURITY_MODEL\.md`\]\(SECURITY_MODEL\.md\)/', r'/\[`SECURITY_MODEL\.md`\]\(security\/SECURITY_MODEL\.md\)/')
          text = text.replace(r'/`docs\/SECURITY_MODEL\.md`[^\n]+`verified-active`/', r'/`docs\/security\/SECURITY_MODEL\.md`[^\n]+`verified-active`/')
          text = text.replace(r'/\[`SECURITY_MODEL\.md`\]\(\.\.\/SECURITY_MODEL\.md\)/', r'/\[`SECURITY_MODEL\.md`\]\(\.\.\/security\/SECURITY_MODEL\.md\)/')
          pointer_test = '''\n\ntest("former security model path remains a compatibility pointer", () => {\n  const pointer = text("docs/SECURITY_MODEL.md");\n  assert.match(pointer, /^# Relocated/m);\n  assert.match(pointer, /\[`security\/SECURITY_MODEL\.md`\]\(security\/SECURITY_MODEL\.md\)/);\n  assert.match(pointer, /compatibility pointer/);\n});\n'''
          if 'former security model path remains a compatibility pointer' not in text:
              text += pointer_test
          test_file.write_text(text)
          PY

          rm .github/workflows/fix-security-model-contract-268.yml

          grep -Fq '../security/SECURITY_MODEL.md' docs/ai/README.md
          ! grep -Fq '](../SECURITY_MODEL.md)' docs/ai/README.md
          grep -Fq 'docs/security/SECURITY_MODEL.md' tests/documentation-security-model.test.mjs
          grep -Fq 'compatibility pointer' tests/documentation-security-model.test.mjs

          node --experimental-strip-types --test tests/documentation-security-model.test.mjs
          git add -A
          git diff --cached --check
          git commit -m 'test: follow canonical security model owner'
          git push origin HEAD:docs/268-security-model-family
