name: Temporary access accessibility hotfix
on:
  push:
    branches: [fix/access-form-labels-icons]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/access-form-labels-icons
      - name: Restore label associations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/access/page.tsx')
          s=p.read_text()
          replacements={
            '<label>Логин</label><input className="ds-input"':'<label htmlFor="access-create-username">Логин</label><input id="access-create-username" className="ds-input"',
            '<label>Отображаемое имя</label><input className="ds-input" value={form.displayName}':'<label htmlFor="access-create-display-name">Отображаемое имя</label><input id="access-create-display-name" className="ds-input" value={form.displayName}',
            '<label>Пароль</label><input className="ds-input" type="password" value={form.password}':'<label htmlFor="access-create-password">Пароль</label><input id="access-create-password" className="ds-input" type="password" value={form.password}',
            '<label>Подтверждение</label><input className="ds-input" type="password" value={form.confirmation}':'<label htmlFor="access-create-confirmation">Подтверждение</label><input id="access-create-confirmation" className="ds-input" type="password" value={form.confirmation}',
            '<label>Роль</label><select className="ds-select" value={form.role}':'<label htmlFor="access-create-role">Роль</label><select id="access-create-role" className="ds-select" value={form.role}',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected form fragment: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/access/page.tsx
          git commit -m "fix: restore access form label associations"
          git push
