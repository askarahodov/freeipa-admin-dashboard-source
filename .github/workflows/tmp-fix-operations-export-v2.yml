name: Temporary Operations Export Fix V2
on:
  push:
    branches: [ui-118-extract-operations-approvals]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-118-extract-operations-approvals
      - name: Export shared operation status badge
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('app/operations/OperationsApprovalsScreens.tsx')
          s=m.read_text().replace('function RunStatusBadge({ status }', 'export function RunStatusBadge({ status }')
          m.write_text(s)
          p=Path('app/page.tsx')
          s=p.read_text().replace('Approvals, Operations, OperationTable, formatDateTime,', 'Approvals, Operations, OperationTable, RunStatusBadge, formatDateTime,')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/operations/OperationsApprovalsScreens.tsx
          git commit -m "ui: export shared operation status badge"
          git push
