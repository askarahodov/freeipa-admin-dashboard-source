name: One-shot UI RBAC integration patch

on:
  push:
    branches:
      - agent/ui-portal-permissions-integration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-rbac-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Apply exact RBAC deduplication
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          import_marker = 'import { buildHomePath, resolveHomeLocation, type HomePage } from "./shell/home-navigation";\n'
          import_line = import_marker + 'import type { PortalPermission, PortalRole } from "../portal-permissions";\nimport { portalRoleLabels } from "../portal-permissions";\n'
          if 'from "../portal-permissions"' not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('expected exactly one home-navigation import marker')
              text = text.replace(import_marker, import_line, 1)

          duplicate_types = 'type PortalRole = "viewer" | "operator" | "admin";\ntype PortalPermission = "directory.read" | "freeipa.write" | "freeipa.delete" | "xyops.run" | "xyops.approve" | "settings.manage";\n'
          if text.count(duplicate_types) != 1:
              raise SystemExit('expected exactly one local PortalRole/PortalPermission declaration')
          text = text.replace(duplicate_types, '', 1)

          role_labels = 'const roleLabels: Record<PortalRole, string> = { viewer: "Наблюдатель", operator: "Оператор", admin: "Администратор" };\n'
          if text.count(role_labels) != 1:
              raise SystemExit('expected exactly one local roleLabels declaration')
          text = text.replace(role_labels, '', 1)

          if 'roleLabels[' in text:
              text = text.replace('roleLabels[', 'portalRoleLabels[')
          elif 'roleLabels' in text:
              raise SystemExit('unexpected roleLabels reference shape; aborting instead of broad replacement')

          path.write_text(text, encoding='utf-8')

          if 'type PortalRole = ' in text or 'type PortalPermission = ' in text or 'const roleLabels:' in text:
              raise SystemExit('RBAC duplicates remain after patch')
          if 'portalRoleLabels[' not in text:
              raise SystemExit('canonical role label map is not referenced')

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git diff -- app/page.tsx
          test "$(git diff --numstat -- app/page.tsx | awk '{print $1}')" = "2"
          test "$(git diff --numstat -- app/page.tsx | awk '{print $2}')" = "3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git rm .github/workflows/agent-ui-portal-permissions-patch.yml
          git commit -m 'refactor: consume canonical portal RBAC definitions [ui-rbac-patch]'
          git push origin HEAD:${GITHUB_REF_NAME}
