name: Auth Finalize Cleanup

on:
  push:
    branches:
      - refactor/267-auth-consumer-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[auth-finalize-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply canonical auth cleanup
        run: python scripts/auth-finalize-cleanup.py
      - name: Focused structural and auth contracts
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            tests/auth-runtime-domain-path-contract.test.mjs \
            tests/auth-canonical-source-contract.test.mjs \
            tests/auth-e2e-routing.test.mjs \
            tests/pr-collision-guard.test.mjs \
            tests/portal-permissions-ui-integration.test.mjs \
            tests/portal-permissions.test.mjs \
            tests/portal-route-contract.test.mjs \
            tests/stable-error-contract.test.mjs \
            tests/local-auth-same-origin.test.mjs \
            tests/local-session-management.test.mjs \
            tests/local-auth-rbac.test.mjs \
            tests/maintenance-rbac.test.mjs \
            tests/backup-encrypted-rbac.test.mjs \
            tests/backup-isolated-rbac.test.mjs \
            tests/backup-selective-restore-rbac.test.mjs \
            tests/documentation-reference-layer.test.mjs
      - name: Verify no active root auth imports remain
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'from\s+["\']\.\./(?:admin-session-authorization|local-auth|local-session-management|portal-permissions|portal-route-contract|stable-error-contract)(?:\.ts)?["\']')
          hits = []
          for root in ("app", "worker", "tests", "scripts", "docs"):
              for path in Path(root).rglob("*"):
                  if not path.is_file() or "docs/superpowers/" in path.as_posix():
                      continue
                  text = path.read_text(errors="ignore")
                  if pattern.search(text):
                      hits.append(path.as_posix())
          if hits:
              raise SystemExit("stale root auth imports: " + ", ".join(sorted(hits)))
          PY
      - name: Remove one-shot transport
        run: rm scripts/auth-finalize-cleanup.py .github/workflows/auth-finalize-cleanup.yml
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(auth): complete canonical consumer migration [auth-finalize-done]"
          git push
