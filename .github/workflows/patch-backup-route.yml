name: Patch backup export route

on:
  push:
    branches:
      - agent/sanitized-backup-export-design
    paths:
      - .github/workflows/patch-backup-route.yml
      - worker/backup-export-entry.ts
      - tests/backup-export-api.test.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sanitized-backup-export-design
      - name: Wire protected backup route
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("worker/index.ts")
          source = path.read_text()

          import_anchor = 'import { applyProcessPresentation, availableProcessPresentationLocales, presentationLocalePreferences, readProcessPresentationSet, resolveProcessPresentationLocale, saveProcessPresentationSet } from "../process-presentation";'
          import_line = 'import { handleBackupExportRequest } from "./backup-export-entry";'
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit("backup route import anchor not found")
              source = source.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          route_anchor = '    const runtimeEnv = env ?? (process.env as unknown as Env);\n\n    if (url.pathname.startsWith("/api/integrations/")) {'
          route_block = '''    const runtimeEnv = env ?? (process.env as unknown as Env);\n\n    if (url.pathname === "/api/admin/backups/export") {\n      const denied = requirePortalPermission(request, runtimeEnv, "backup.export");\n      if (denied) return denied;\n      return handleBackupExportRequest(request, runtimeEnv, createAuditContext(portalAccess(request, runtimeEnv)));\n    }\n\n    if (url.pathname.startsWith("/api/integrations/")) {'''
          if 'url.pathname === "/api/admin/backups/export"' not in source:
              if route_anchor not in source:
                  raise SystemExit("backup route anchor not found")
              source = source.replace(route_anchor, route_block, 1)

          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts
          git commit -m "feat: expose protected backup export route"
          git push origin HEAD:agent/sanitized-backup-export-design
