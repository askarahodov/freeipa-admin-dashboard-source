name: Temporary Users Groups Extraction
on:
  push:
    branches: [ui-118-extract-users-groups]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui-118-extract-users-groups}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace('import { LegacyOverview } from "./overview/LegacyOverview";\n','import { LegacyOverview } from "./overview/LegacyOverview";\nimport { Groups, Users, type DirectoryGroup, type DirectoryUser } from "./directory/DirectoryScreens";\n')
          s=s.replace('type DirectoryUser = { uid: string; name: string; firstName: string; lastName: string; email: string; groups: number; groupNames: string[]; active: boolean };\ntype DirectoryGroup = { name: string; description: string; members: number; memberUids: string[]; type: string };\n','')
          start=s.index('\nfunction Users('); end=s.index('\nfunction AutomationCatalog(',start)
          p.write_text(s[:start]+'\n'+s[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx
          git commit -m "ui: wire extracted Users and Groups screens"
          git push
