name: one-shot runtime auth owners

on:
  push:
    branches:
      - refactor/267-runtime-auth-owners

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply runtime auth ownership move
        run: python .github/scripts/apply-runtime-auth-owners.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Focused auth/session/RBAC coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f | grep -E '(auth|session|rbac|permission|role)' | sort)
          node --experimental-strip-types --test --test-concurrency=1 "${files[@]}" tests/auth-runtime-domain-path-contract.test.mjs
      - name: Verify router and ownership paths
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/auth-e2e-routing.test.mjs tests/pr-collision-guard.test.mjs tests/auth-runtime-domain-path-contract.test.mjs
          test "$(cat local-auth.ts)" = 'export * from "./src/auth/local-auth.ts";'
          test "$(cat local-session-management.ts)" = 'export * from "./src/auth/local-session-management.ts";'
          test "$(cat admin-session-authorization.ts)" = 'export * from "./src/auth/admin-session-authorization.ts";'
      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply-runtime-auth-owners.py .github/workflows/one-shot-runtime-auth-owners.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(auth): establish runtime auth owners [one-shot-done]'
          git push origin HEAD:refactor/267-runtime-auth-owners
