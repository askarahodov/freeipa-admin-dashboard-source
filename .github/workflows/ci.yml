name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Canonical CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan_json: ${{ steps.scope.outputs.plan_json }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      discover_tests: ${{ steps.scope.outputs.discover_tests }}
      docs_consistency: ${{ steps.scope.outputs.docs_consistency }}
      dependency_security: ${{ steps.scope.outputs.dependency_security }}
      build: ${{ steps.scope.outputs.build }}
      container_security: ${{ steps.scope.outputs.container_security }}
      recovery_compose: ${{ steps.scope.outputs.recovery_compose }}
      test: ${{ steps.scope.outputs.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0

      - id: scope
        name: Determine canonical Required CI plan
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/ci-changed-inputs.bin"
          planner_args=(--github-output "$GITHUB_OUTPUT" --github-step-summary "$GITHUB_STEP_SUMMARY")
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            : > "$changed"
            node scripts/ci-required-plan.mjs "${planner_args[@]}" --full "$changed"
            exit 0
          fi
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          test -n "$merge_base"
          git diff --name-status -z --find-renames "$merge_base" "$head_sha" > "$changed"
          node scripts/ci-required-plan.mjs "${planner_args[@]}" "$changed"

      - name: Validate mandatory planner outputs
        shell: bash
        env:
          PLAN_JSON: ${{ steps.scope.outputs.plan_json }}
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
        run: |
          set -euo pipefail
          test -n "$PLAN_JSON"
          [[ "$DOCS_ONLY" == "true" || "$DOCS_ONLY" == "false" ]]
          node -e 'const plan=JSON.parse(process.env.PLAN_JSON); if (plan.version !== 1 || !plan.jobs) process.exit(1)'

  discover-tests:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.discover_tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - id: list
        name: Discover and shard test files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/discover-node-tests.mjs > "$RUNNER_TEMP/server-tests.txt"
          node scripts/ci-test-shards.mjs \
            --input "$RUNNER_TEMP/server-tests.txt" \
            --github-output "$GITHUB_OUTPUT" \
            --max-shards 8

  docs-consistency:
    name: Documentation consistency
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.docs_consistency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Check active documentation contracts
        run: npm run docs:check

  dependency-security:
    name: Dependency security
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.dependency_security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - id: scope
        name: Determine dependency audit scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/dependency-security-changed.txt"
          cat "$RUNNER_TEMP/dependency-security-changed.txt"
          if grep -Eq '^(package\.json|package-lock\.json|security/audit-allowlist\.json)$' "$RUNNER_TEMP/dependency-security-changed.txt"; then
            echo "live_audit=true" >> "$GITHUB_OUTPUT"
            echo "Dependency inputs changed; live npm audit and SBOM are required."
          else
            echo "live_audit=false" >> "$GITHUB_OUTPUT"
            echo "Dependency inputs unchanged; using deterministic policy/allowlist validation only."
          fi

      - name: Validate dependency audit policy contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/dependency-audit-policy.mjs
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { validateAllowlist } from "./scripts/dependency-audit-policy.mjs"; validateAllowlist(JSON.parse(readFileSync("security/audit-allowlist.json", "utf8"))); console.log("Dependency audit policy and allowlist are structurally valid.")'

      - name: Enforce production audit policy
        if: steps.scope.outputs.live_audit == 'true'
        run: npm run security:audit

      - name: Generate production CycloneDX SBOM
        if: steps.scope.outputs.live_audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          npm run --silent security:sbom > artifacts/security/npm-production-sbom.cdx.json
          node -e 'const fs=require("fs"); const bom=JSON.parse(fs.readFileSync("artifacts/security/npm-production-sbom.cdx.json","utf8")); if (bom.bomFormat !== "CycloneDX" || !Array.isArray(bom.components)) process.exit(1)'

      - name: Upload production SBOM
        if: steps.scope.outputs.live_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-production-sbom
          path: artifacts/security/npm-production-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Create source snapshot
        shell: bash
        run: tar -czf "$RUNNER_TEMP/source-snapshot.tar.gz" --exclude=.git --exclude=node_modules --exclude=dist .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production dependency tree
        run: npm ls --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  container-security:
    name: Runtime image security
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.container_security == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Build runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packaging
          docker build --progress=plain --target runtime -t portal-security-scan . 2>&1 | tee artifacts/packaging/runtime-build.log

      - name: Record runtime packaging metrics
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/docker-packaging-metrics.mjs \
            --image portal-security-scan \
            --target runtime \
            --build-log artifacts/packaging/runtime-build.log \
            --output artifacts/packaging/runtime-packaging-metrics.json \
            --source-sha "$SOURCE_SHA"

      - name: Upload runtime packaging metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packaging-metrics
          path: artifacts/packaging/runtime-*
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare security artifacts
        run: mkdir -p artifacts/security

      - name: Scan fixable runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: portal-security-scan
          format: json
          output: artifacts/security/runtime-image-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'

      - name: Upload runtime image scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-security-scan
          path: artifacts/security/runtime-image-trivy.json
          if-no-files-found: warn
          retention-days: 14

  recovery-compose:
    name: Test recovery container and volume
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.recovery_compose == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run recovery contracts
        run: node --experimental-strip-types --test tests/recovery/recovery-container-contract.test.mjs tests/recovery/recovery-compose-smoke.test.mjs tests/recovery/recovery-fault-matrix.test.mjs

      - name: Build isolated recovery image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packaging
          docker build --progress=plain --target recovery -t portal-recovery-ci . 2>&1 | tee artifacts/packaging/recovery-build.log

      - name: Record recovery packaging metrics
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/docker-packaging-metrics.mjs \
            --image portal-recovery-ci \
            --target recovery \
            --build-log artifacts/packaging/recovery-build.log \
            --output artifacts/packaging/recovery-packaging-metrics.json \
            --source-sha "$SOURCE_SHA"

      - name: Upload recovery packaging metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-packaging-metrics
          path: artifacts/packaging/recovery-*
          if-no-files-found: warn
          retention-days: 14

      - name: Run disposable named-volume smoke
        run: npm run test:recovery:compose

  test:
    name: Test shard ${{ matrix.shard.name }}
    needs: [plan, discover-tests, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.test == 'true' && needs.discover-tests.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover-tests.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run shard
        shell: bash
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          TEST_FILES_JSON: ${{ toJSON(matrix.shard.files) }}
        run: |
          set -euo pipefail
          mapfile -t test_files < <(node -e 'for (const file of JSON.parse(process.env.TEST_FILES_JSON || "[]")) console.log(file)')
          if (( ${#test_files[@]} == 0 )); then
            echo "Shard ${SHARD_NAME} contains no test files"
            exit 1
          fi
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=1 "${test_files[@]}" 2>&1 | tee "server-shard-${SHARD_NAME}.tap"

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-shard-${{ matrix.shard.name }}-log
          path: server-shard-${{ matrix.shard.name }}.tap
          if-no-files-found: error
          retention-days: 1

  required:
    name: Required CI
    if: always()
    needs: [plan, discover-tests, docs-consistency, dependency-security, build, container-security, recovery-compose, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate contract
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify canonical plan and required CI results
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          DISCOVER_RESULT: ${{ needs.discover-tests.result }}
          DOCS_RESULT: ${{ needs.docs-consistency.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
          RECOVERY_RESULT: ${{ needs.recovery-compose.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]]
          test -n "$PLAN_JSON"
          results="$(node -e 'process.stdout.write(JSON.stringify({"discover-tests":process.env.DISCOVER_RESULT,"docs-consistency":process.env.DOCS_RESULT,"dependency-security":process.env.SECURITY_RESULT,build:process.env.BUILD_RESULT,"container-security":process.env.CONTAINER_RESULT,"recovery-compose":process.env.RECOVERY_RESULT,test:process.env.TEST_RESULT}))')"
          node scripts/ci-required-gate.mjs "$PLAN_JSON" "$results"
