name: Regenerate dependency lock

on:
  push:
    branches: [agent/dependency-security-gate]
    paths:
      - package.json
      - .github/workflows/regenerate-dependency-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-gate
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "Regenerate dependency lockfile"
          git push origin HEAD:agent/dependency-security-gate
