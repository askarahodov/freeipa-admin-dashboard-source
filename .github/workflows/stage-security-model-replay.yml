name: Stage security model replay

on:
  push:
    branches:
      - docs/268-security-model-replay-0227

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay verified security model slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          old=a23cfb53b7f9c0a7cbf4bf58da3f4a3f3beb3347
          git fetch origin main --depth=50

          git show "$old:docs/SECURITY_MODEL.md" > docs/SECURITY_MODEL.md
          mkdir -p docs/security
          git show "$old:docs/security/SECURITY_MODEL.md" > docs/security/SECURITY_MODEL.md
          git show "$old:docs/README.md" > docs/README.md
          git show "$old:docs/DOCUMENTATION_INVENTORY.md" > docs/DOCUMENTATION_INVENTORY.md
          git show "$old:docs/security/README.md" > docs/security/README.md
          git show "$old:tests/documentation-security-model.test.mjs" > tests/documentation-security-model.test.mjs

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ai/README.md')
          text = p.read_text()
          text = text.replace('](../SECURITY_MODEL.md)', '](../security/SECURITY_MODEL.md)')
          p.write_text(text)
          PY

          rm .github/workflows/stage-security-model-replay.yml
          test -f docs/security/SECURITY_MODEL.md
          grep -Fq 'security/SECURITY_MODEL.md' docs/SECURITY_MODEL.md
          grep -Fq '../security/SECURITY_MODEL.md' docs/ai/README.md
          if grep -Fq '](../SECURITY_MODEL.md)' docs/ai/README.md; then
            echo 'stale AI security-model link remains' >&2
            exit 1
          fi
          grep -Fq 'Product runtime/security contracts' docs/ai/README.md
          node --test tests/documentation-security-model.test.mjs
          git add -A
          git diff --cached --check
          git commit -m 'docs: move security model to canonical owner'
          git push origin HEAD:docs/268-security-model-replay-0227
