name: One-shot 270 freeipa test family

on:
  push:
    branches:
      - repo/270-freeipa-test-family

permissions:
  contents: write

jobs:
  relocate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move complete FreeIPA test family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/freeipa
          count=$(find tests -maxdepth 1 -type f -name 'freeipa-*.test.mjs' | wc -l)
          test "$count" -eq 19
          git mv tests/freeipa-*.test.mjs tests/freeipa/
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path('tests/freeipa').glob('freeipa-*.test.mjs')):
              text = path.read_text()
              text = text.replace('from "../', 'from "../../')
              text = text.replace("from '../", "from '../../")
              text = text.replace('new URL("../', 'new URL("../../')
              text = text.replace("new URL('../", "new URL('../../")
              text = text.replace('new URL(`../', 'new URL(`../../')
              text = text.replace('path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..")', 'path.resolve(path.dirname(fileURLToPath(import.meta.url)), "../..")')
              path.write_text(text)

          contract = Path('tests/freeipa/freeipa-domain-path-contract.test.mjs')
          text = contract.read_text().replace(
              'tests/freeipa-domain-path-contract.test.mjs',
              'tests/freeipa/freeipa-domain-path-contract.test.mjs',
          )
          contract.write_text(text)
          PY

      - name: Build
        run: npm run build

      - name: Run complete FreeIPA family
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/freeipa/*.test.mjs
          node --test tests/node-test-discovery.test.mjs tests/test-layout-policy.test.mjs

      - name: Validate relocation invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tests/freeipa -maxdepth 1 -type f -name 'freeipa-*.test.mjs' | wc -l)" -eq 19
          test "$(find tests -maxdepth 1 -type f -name 'freeipa-*.test.mjs' | wc -l)" -eq 0
          grep -q 'tests/freeipa/freeipa-domain-path-contract.test.mjs' tests/freeipa/freeipa-domain-path-contract.test.mjs
          ! grep -RIn --exclude-dir=.git --exclude-dir=node_modules 'tests/freeipa-domain-path-contract.test.mjs' .
          git diff --check

      - name: Commit validated relocation and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-270-freeipa-family.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: move FreeIPA test family under domain owner"
          git push origin HEAD:repo/270-freeipa-test-family
