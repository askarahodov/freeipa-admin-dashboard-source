name: Auth E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: auth-e2e-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Auth E2E routing contract
        run: node --test tests/auth-e2e-routing.test.mjs

      - name: Determine Auth E2E scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/auth-e2e-changed-files.txt"
          node scripts/auth-e2e-scope.mjs --github-output "$GITHUB_OUTPUT" "$RUNNER_TEMP/auth-e2e-changed-files.txt"

      - name: Auth E2E not required for this pull request
        if: steps.scope.outputs.run != 'true'
        run: echo "No Auth E2E-relevant files changed; stable check succeeds without Chromium."

      - name: Run settings and schema contracts
        if: steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --test tests/portal-schema-inventory.test.mjs tests/portal-schema-migrations.test.mjs tests/portal-schema-review-hardening.test.mjs tests/portal-schema-boundary.test.mjs tests/local-diagnostics-schema.test.mjs tests/settings-draft-lifecycle.test.mjs tests/settings-reset-fallback-refresh.test.mjs tests/settings-source-runtime-safety.test.mjs

      - name: Prepare isolated E2E environment
        if: steps.scope.outputs.run == 'true'
        run: cp .env.e2e.example .env.e2e

      - name: Run Chromium authentication scenarios
        if: steps.scope.outputs.run == 'true'
        env:
          CI: "true"
        run: npm run test:e2e:auth

      - name: Upload Playwright artifacts
        if: steps.scope.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-report
          path: |
            artifacts/e2e/playwright-report
            artifacts/e2e/test-results
            artifacts/e2e/compose.log
          if-no-files-found: warn
          retention-days: 14
