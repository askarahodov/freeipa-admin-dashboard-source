name: One-shot stage error-code ownership reference 858c

on:
  push:
    branches:
      - docs/268-error-code-reference-replay-858c

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Move error-code ownership reference contract
        shell: bash
        run: |
          set -euo pipefail
          cp docs/ERROR_CODE_OWNERSHIP.md docs/reference/ERROR_CODE_OWNERSHIP.md
          cat > docs/ERROR_CODE_OWNERSHIP.md <<'EOF'
          # Relocated

          The canonical stable error-code ownership contract has moved to [`reference/ERROR_CODE_OWNERSHIP.md`](reference/ERROR_CODE_OWNERSHIP.md). This compatibility pointer is retained for existing external links; do not update the ownership contract here.
          EOF
          python <<'PY'
          from pathlib import Path
          suffixes={'.md','.mjs','.js','.ts','.tsx','.yml','.yaml','.json'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              s=p.as_posix()
              if s.startswith(('docs/superpowers/','.git/','node_modules/','.github/workflows/one-shot-268-error-code-reference-858c.yml')):
                  continue
              text=p.read_text(encoding='utf-8')
              old=text
              text=text.replace('docs/ERROR_CODE_OWNERSHIP.md', 'docs/reference/ERROR_CODE_OWNERSHIP.md')
              if s.startswith('docs/') and not s.startswith('docs/reference/'):
                  text=text.replace('](ERROR_CODE_OWNERSHIP.md)', '](reference/ERROR_CODE_OWNERSHIP.md)')
              if s.startswith('docs/ai/'):
                  text=text.replace('](../ERROR_CODE_OWNERSHIP.md)', '](../reference/ERROR_CODE_OWNERSHIP.md)')
              if text != old:
                  p.write_text(text,encoding='utf-8')
          ref=Path('docs/reference/README.md')
          text=ref.read_text(encoding='utf-8')
          entry='- [`ERROR_CODE_OWNERSHIP.md`](ERROR_CODE_OWNERSHIP.md) — stable error-code ownership and verification contract.'
          if entry not in text:
              anchor='- [`ERROR_CODES.md`](ERROR_CODES.md) — stable error-code reference.'
              if anchor in text:
                  text=text.replace(anchor, anchor+'\n'+entry)
              else:
                  text += '\n'+entry+'\n'
              ref.write_text(text,encoding='utf-8')
          PY
          cat > tests/documentation-error-code-ownership.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          function text(path) {
            return readFileSync(new URL(`../${path}`, import.meta.url), "utf8");
          }

          test("stable error-code ownership has one canonical reference owner", () => {
            const canonical = text("docs/reference/ERROR_CODE_OWNERSHIP.md");
            const pointer = text("docs/ERROR_CODE_OWNERSHIP.md");
            assert.match(canonical, /^# Stable error-code ownership/m);
            assert.match(canonical, /src\/auth\/stable-error-contract\.ts/);
            assert.match(canonical, /docs\/reference\/ERROR_CODES\.md/);
            assert.match(canonical, /tests\/stable-error-contract\.test\.mjs/);
            assert.match(pointer, /^# Relocated/m);
            assert.match(pointer, /reference\/ERROR_CODE_OWNERSHIP\.md/);
            assert.match(pointer, /compatibility pointer/);
          });

          test("reference navigation, docs index and inventory point to the canonical owner", () => {
            const reference = text("docs/reference/README.md");
            const index = text("docs/README.md");
            const inventory = text("docs/DOCUMENTATION_INVENTORY.md");
            assert.match(reference, /\[`ERROR_CODE_OWNERSHIP\.md`\]\(ERROR_CODE_OWNERSHIP\.md\)/);
            assert.equal((reference.match(/ERROR_CODE_OWNERSHIP\.md/g) || []).length, 2);
            assert.match(index, /reference\/ERROR_CODE_OWNERSHIP\.md/);
            assert.match(inventory, /`docs\/reference\/ERROR_CODE_OWNERSHIP\.md`[^\n]+`verified-active`/);
          });
          EOF
      - name: Validate error-code ownership reference contract
        shell: bash
        run: |
          set -euo pipefail
          npm run docs:check
          node --test tests/documentation-error-code-ownership.test.mjs tests/documentation-reference-layer.test.mjs
          git diff --check
          test -s docs/reference/ERROR_CODE_OWNERSHIP.md
          grep -q '^# Relocated' docs/ERROR_CODE_OWNERSHIP.md
          if git grep -n 'docs/ERROR_CODE_OWNERSHIP.md' -- ':!docs/ERROR_CODE_OWNERSHIP.md' ':!docs/superpowers/**' ':!.github/workflows/one-shot-268-error-code-reference-858c.yml'; then
            echo 'stale active root-path references remain'
            exit 1
          fi
      - name: Commit final self-cleaned batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-268-error-code-reference-858c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'docs: move error-code ownership to reference owner'
          git push origin HEAD:docs/268-error-code-reference-replay-858c
