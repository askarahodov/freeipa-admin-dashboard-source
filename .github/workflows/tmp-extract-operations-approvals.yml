name: Temporary Operations Approvals Extraction
on:
  push:
    branches: [ui-118-extract-operations-approvals]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-118-extract-operations-approvals
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx'); s=p.read_text()
          anchor='import { Groups, Users, type DirectoryGroup, type DirectoryUser } from "./directory/DirectoryScreens";\n'
          s=s.replace(anchor, anchor+'import { Approvals, Operations, OperationTable, formatDateTime, type ApprovalRecord, type RunRecord, type RunStats } from "./operations/OperationsApprovalsScreens";\n')
          for block in [
            'type RunStatus = "queued" | "running" | "success" | "failed" | "cancelled" | "unknown";\ntype RunStage = { id: string; title: string; status: RunStatus; startedAt: number | null; completedAt: number | null; error: string };\ntype RunResultValue = { key: string; label: string; value: string; kind: "text" | "number" | "boolean" | "json" };\ntype RunResultLink = { id: string; title: string; url: string; host: string };\ntype RunResultFile = { id: string; filename: string; size: number; mimeType: string; downloadUrl: string };\ntype RunResult = { available: boolean; summary: string; values: RunResultValue[]; links: RunResultLink[]; files: RunResultFile[]; table: { columns: string[]; rows: string[][] } | null; capturedAt: number; truncated: boolean };\ntype RunRecord = { id: string; jobId: string; eventId: string; title: string; kind: "event" | "workflow"; mode: "demo" | "live"; status: RunStatus; actor: string; subject: string; error: string | null; stages: RunStage[]; startedAt: number; updatedAt: number; completedAt: number | null; result: RunResult | null; actions: { cancel: boolean; rerun: boolean; rerunLabel: string; reason: string; parentRunId: string } };\ntype RunStats = { today: number; queued: number; success: number; failed: number };\n',
          ]: s=s.replace(block,'')
          a=s.index('type ApprovalStatus = '); b=s.index('type CatalogPolicyRule = ',a); s=s[:a]+s[b:]
          a=s.index('\nfunction Approvals('); b=s.index('\nfunction NotificationCenter(',a); s=s[:a]+'\n'+s[b:]
          a=s.index('\nfunction Operations('); b=s.index('\nfunction PersistentConnectionSettings(',a); s=s[:a]+'\n'+s[b:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx
          git commit -m "ui: wire extracted Operations and Approvals screens"
          git push
