name: Temporary Portal Overlay Extraction
on:
  push:
    branches: [ui-118-extract-portal-overlays-sol]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-118-extract-portal-overlays-sol
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = '\nfunction NotificationCenter('
          start = s.index(marker)
          block = s[start+1:]
          block = block.replace('function NotificationCenter(', 'export function NotificationCenter(', 1)
          block = block.replace('function FreeIpaActionModal(', 'export function FreeIpaActionModal(', 1)
          block = block.replace('function ProcessModal(', 'export function ProcessModal(', 1)
          header = '''"use client";\n\nimport { useEffect, useState } from "react";\nimport type { CatalogEvent, RouteField } from "../../automation-types";\nimport { fieldConditionMatches } from "../../field-conditions";\nimport type { FreeIpaAction, FreeIpaOperation } from "../../freeipa-ui-events";\nimport { resolveProcessIconGlyph } from "./home-presentation";\nimport { formatDateTime } from "../operations/OperationsApprovalsScreens";\n\nexport type PortalNotification = { id: string; runId: string; status: "success" | "failed" | "cancelled"; title: string; message: string; createdAt: number; readAt: number | null };\n\n'''
          Path('app/shell/PortalOverlays.tsx').write_text(header + block)
          s = s[:start] + '\n'
          import_anchor = 'import { Settings } from "./settings/SettingsScreens";\n'
          assert import_anchor in s
          s = s.replace(import_anchor, import_anchor + 'import { FreeIpaActionModal, NotificationCenter, ProcessModal, type PortalNotification } from "./shell/PortalOverlays";\n', 1)
          s = s.replace('import { conditionFieldNames, fieldConditionMatches } from "../field-conditions";', 'import { conditionFieldNames } from "../field-conditions";')
          s = s.replace('import { Approvals, Operations, OperationTable, RunStatusBadge, formatDateTime, type ApprovalRecord, type RunRecord, type RunStats } from "./operations/OperationsApprovalsScreens";', 'import { Approvals, Operations, OperationTable, type ApprovalRecord, type RunRecord, type RunStats } from "./operations/OperationsApprovalsScreens";')
          s = s.replace('type PortalNotification = { id: string; runId: string; status: "success" | "failed" | "cancelled"; title: string; message: string; createdAt: number; readAt: number | null };\n', '')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/shell/PortalOverlays.tsx
          git commit -m "ui: extract portal overlays from Home orchestrator"
          git push
