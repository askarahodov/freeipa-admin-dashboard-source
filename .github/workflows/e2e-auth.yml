name: Scoped E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: scoped-e2e-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoped-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate test routing policy
        run: node --test tests/auth/auth-e2e-routing.test.mjs tests/architecture/test-scope-routing.test.mjs

      - name: Determine canonical CI and E2E plan
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/e2e-changed-inputs.bin"
          planner_args=(--github-output "$GITHUB_OUTPUT" --github-step-summary "$GITHUB_STEP_SUMMARY")

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            : > "$changed"
            node scripts/auth-e2e-scope.mjs "${planner_args[@]}" --full "$changed"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          test -n "$merge_base"
          git diff --name-status -z --find-renames "$merge_base" "$head_sha" > "$changed"

          base_package="$RUNNER_TEMP/package.base.json"
          head_package="$RUNNER_TEMP/package.head.json"
          if git show "$merge_base:package.json" > "$base_package" 2>/dev/null && git show "$head_sha:package.json" > "$head_package" 2>/dev/null; then
            planner_args+=(--base-package "$base_package" --head-package "$head_package")
          fi

          node scripts/auth-e2e-scope.mjs "${planner_args[@]}" "$changed"

      - name: Report selected coverage
        run: |
          echo "full=${{ steps.scope.outputs.full }}"
          echo "full_fallback_reason=${{ steps.scope.outputs.full_fallback_reason }}"
          echo "categories=${{ steps.scope.outputs.categories }}"
          echo "browser_specs=${{ steps.scope.outputs.browser_specs }}"
          echo "contract_tests=${{ steps.scope.outputs.contract_tests }}"
          echo "required_jobs=${{ steps.scope.outputs.required_jobs }}"

      - name: Validate planner outputs exist
        shell: bash
        env:
          RUN_PLAN: ${{ steps.scope.outputs.run }}
          FULL_PLAN: ${{ steps.scope.outputs.full }}
          REQUIRED_JOBS: ${{ steps.scope.outputs.required_jobs }}
        run: |
          set -euo pipefail
          [[ "$RUN_PLAN" == "true" || "$RUN_PLAN" == "false" ]]
          [[ "$FULL_PLAN" == "true" || "$FULL_PLAN" == "false" ]]
          test -n "$REQUIRED_JOBS"

      - name: No browser E2E required for this pull request
        if: steps.scope.outputs.browser_specs == ''
        run: echo "Canonical plan selected no browser E2E category for this change."

      - name: Run affected contract tests
        if: steps.scope.outputs.contract_tests != ''
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tests <<< "${{ steps.scope.outputs.contract_tests }}"
          node --experimental-strip-types --test "${tests[@]}"

      - name: Prepare isolated E2E environment
        if: steps.scope.outputs.browser_specs != ''
        run: cp fixtures/env/e2e.example .env.e2e

      - name: Run affected Chromium scenarios
        if: steps.scope.outputs.browser_specs != ''
        env:
          CI: "true"
          E2E_SPECS: ${{ steps.scope.outputs.browser_specs }}
        run: npm run test:e2e:auth

      - name: Upload Playwright artifacts
        if: steps.scope.outputs.browser_specs != '' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-e2e-report
          path: |
            artifacts/e2e/playwright-report
            artifacts/e2e/test-results
            artifacts/e2e/compose.log
          if-no-files-found: warn
          retention-days: 14
