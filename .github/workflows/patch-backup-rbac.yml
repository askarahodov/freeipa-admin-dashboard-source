name: Patch backup export RBAC

on:
  push:
    branches:
      - agent/sanitized-backup-export-design
    paths:
      - .github/workflows/patch-backup-rbac.yml
      - tests/backup-export-rbac.test.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sanitized-backup-export-design
      - name: Add backup export permission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("worker/index.ts")
          source = path.read_text()
          old_type = 'type PortalPermission = "directory.read" | "freeipa.write" | "freeipa.delete" | "xyops.run" | "xyops.approve" | "settings.manage";'
          new_type = 'type PortalPermission = "directory.read" | "freeipa.write" | "freeipa.delete" | "xyops.run" | "xyops.approve" | "settings.manage" | "backup.export";'
          old_admin = 'admin: ["directory.read", "freeipa.write", "freeipa.delete", "xyops.run", "xyops.approve", "settings.manage"],'
          new_admin = 'admin: ["directory.read", "freeipa.write", "freeipa.delete", "xyops.run", "xyops.approve", "settings.manage", "backup.export"],'

          if old_type in source:
              source = source.replace(old_type, new_type, 1)
          elif new_type not in source:
              raise SystemExit("PortalPermission anchor not found")

          if old_admin in source:
              source = source.replace(old_admin, new_admin, 1)
          elif new_admin not in source:
              raise SystemExit("admin permission anchor not found")

          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts
          git commit -m "feat: add backup export permission"
          git push origin HEAD:agent/sanitized-backup-export-design
